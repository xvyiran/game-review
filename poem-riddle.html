<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>图诗印谱 v3.2</title>
<style>
:root{--juan:#EDE6D6;--ink:#22262B;--ink3:#6E6A60;--zhu:#C0392B;--qing:#2F6C7A;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{background:#E3DAC6;font-family:"Songti SC","STSong","Noto Serif SC",serif;color:var(--ink);
 display:flex;justify-content:center;overflow:hidden;}
#app{width:100%;max-width:430px;height:100vh;background:var(--tint,var(--juan));transition:background .5s;
 background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.012) 0 1px,transparent 1px 3px);
 display:flex;flex-direction:column;padding:16px 16px 18px;position:relative;overflow:hidden;}

/* 首页 */
.home{margin:auto;text-align:center;width:100%;}
.home h1{font-family:"Kaiti SC","STKaiti",serif;font-size:36px;font-weight:400;letter-spacing:.34em;margin:0 0 14px;}
.home p{font-size:14px;color:var(--ink3);line-height:2.1;margin:0 0 30px;letter-spacing:.04em;}
.lvs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.lv{aspect-ratio:1;border:1px solid rgba(34,38,43,.28);display:flex;flex-direction:column;
 align-items:center;justify-content:center;cursor:pointer;transition:background .12s;}
.lv b{font-family:"Kaiti SC","STKaiti",serif;font-size:21px;font-weight:400;}
.lv i{font-style:normal;font-size:9.5px;color:var(--zhu);margin-top:2px;}
.lv.done{border-color:rgba(192,57,43,.45);background:rgba(192,57,43,.05);}
.lv.now{border:2px solid var(--ink);}
.lv.lock{opacity:.24;pointer-events:none;border-style:dashed;}
.lv.press{background:rgba(47,108,122,.14);}
.go{width:100%;background:var(--ink);color:var(--juan);border:0;padding:16px;
 font-family:"Kaiti SC","STKaiti",serif;font-size:19px;letter-spacing:.36em;cursor:pointer;}
.go.press{opacity:.82;}
.mini2{margin-top:16px;font-size:12.5px;color:var(--ink3);letter-spacing:.14em;cursor:pointer;}
.mini2.press{color:var(--zhu);}

/* 顶栏 */
.top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;}
.top .n{font-size:12px;color:var(--ink3);letter-spacing:.16em;}
.top .sc{font-family:"Kaiti SC","STKaiti",serif;font-size:26px;color:var(--zhu);line-height:1;position:relative;}
.fly{position:absolute;right:0;top:0;font-size:15px;animation:fly .9s ease-out forwards;pointer-events:none;}
@keyframes fly{0%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-26px)}}

/* 拓片 */
.stage{background:var(--deep,#23282E);position:relative;padding:16px 12px 22px;margin:0 -4px;transition:background .5s;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 2px 0 rgba(34,38,43,.12);}
.stage::before{content:"";position:absolute;inset:5px;border:1px solid rgba(237,230,214,.13);pointer-events:none;}
.grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:flex-start;}
.cw{width:74px;}
.cell{width:74px;height:74px;display:flex;align-items:center;justify-content:center;position:relative;}
.cell.hid{border:1px dashed rgba(237,230,214,.3);animation:breath 2.4s ease-in-out infinite;}
.cell.on{background:#EDE6D6;box-shadow:0 1px 6px rgba(0,0,0,.35);}
.cell.fresh{animation:glow 1.4s ease-out;}
@keyframes breath{0%,100%{opacity:.5}50%{opacity:.95}}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(217,88,74,.85),0 1px 6px rgba(0,0,0,.35)}
 100%{box-shadow:0 0 0 16px rgba(217,88,74,0),0 1px 6px rgba(0,0,0,.35)}}
.cell .q{font-family:"Kaiti SC","STKaiti",serif;font-size:24px;color:rgba(237,230,214,.34);}
.cell .em{font-size:41px;line-height:1;animation:stamp .32s cubic-bezier(.2,1.4,.4,1);}
@keyframes stamp{0%{transform:scale(1.5) rotate(-7deg);opacity:0}60%{transform:scale(.94) rotate(2deg);opacity:1}100%{transform:none}}
.cap{margin-top:7px;font-family:"Kaiti SC","STKaiti",serif;font-size:12px;line-height:1.35;
 text-align:center;color:#7FC4C8;opacity:0;transition:opacity .35s;min-height:1px;}
.cap.in{opacity:1;}
.plain{margin:14px 4px 0;border:1px dashed rgba(217,88,74,.5);position:relative;padding:11px 10px 10px;}
.plain .pl{position:absolute;left:9px;top:-8px;background:var(--deep,#23282E);padding:0 6px;
 font-family:"Kaiti SC","STKaiti",serif;font-size:11px;color:#D9584A;letter-spacing:.18em;}
.plain .pt{font-family:"Kaiti SC","STKaiti",serif;font-size:14.5px;line-height:1.6;color:rgba(237,230,214,.32);text-align:center;}
.plain.on{border-style:solid;}
.plain.on .pt{color:#EDE6D6;}
.plain.fresh{animation:glowp 1.4s ease-out;}
@keyframes glowp{0%{box-shadow:0 0 0 0 rgba(217,88,74,.7)}100%{box-shadow:0 0 0 14px rgba(217,88,74,0)}}
.more{position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);white-space:nowrap;
 background:#EDE6D6;border:0;color:var(--ink);box-shadow:0 2px 7px rgba(0,0,0,.3);
 font-family:"Kaiti SC","STKaiti",serif;font-size:15px;letter-spacing:.12em;padding:9px 22px;cursor:pointer;z-index:3;}
.more.press{background:#DFD6C2;transform:translateX(-50%) translateY(1px);}
.more.pl2{background:#C0392B;color:#fff;}

/* 册子 */
.book{flex:1;display:flex;flex-wrap:wrap;margin-top:30px;padding-top:12px;position:relative;overflow-y:auto;}
.book::after{content:"";position:absolute;left:50%;top:36px;bottom:4px;width:1px;background:rgba(34,38,43,.14);}
.book.solo{display:block;margin-top:20px;}
.book.solo::after{display:none;}
.bhint{flex:0 0 100%;text-align:center;font-size:12px;color:var(--ink3);letter-spacing:.1em;margin-bottom:10px;}
.col{flex:1 1 40%;padding:0 6px;}
.line{position:relative;display:flex;justify-content:center;gap:1px;cursor:pointer;color:#3B3F45;
 font-family:"Kaiti SC","STKaiti",serif;transition:opacity .35s,background .1s;}
.line span{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:1.05em;}
.line span i{font-style:normal;font-family:-apple-system,"PingFang SC",sans-serif;font-size:9px;
 line-height:1.15;color:rgba(34,38,43,.42);margin-bottom:1px;}
.line.press{background:rgba(47,108,122,.16);}
.line::after{content:"";position:absolute;left:6%;right:6%;top:50%;height:1.5px;transform:scaleX(0);transform-origin:left;transition:transform .3s;}
.line.out{opacity:.24;pointer-events:none;}
.line.out::after{background:var(--ink3);transform:scaleX(1);}
.line.shake{animation:shake .34s;}
@keyframes shake{0%,100%{transform:none}22%{transform:translateX(-7px)}55%{transform:translateX(6px)}80%{transform:translateX(-3px)}}
.line.hit{color:var(--zhu);opacity:1!important;}
.line.hit::after{display:none;}
.typotip{flex:0 0 100%;border:1px solid rgba(192,57,43,.6);background:rgba(192,57,43,.07);
 padding:9px 10px;margin-bottom:10px;font-size:13px;line-height:1.6;animation:fade .25s;}
.typotip b{display:block;font-family:"Kaiti SC","STKaiti",serif;color:var(--zhu);font-weight:400;letter-spacing:.2em;margin-bottom:3px;}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.seal{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);z-index:20;pointer-events:none;
 font-family:"Kaiti SC","STKaiti",serif;color:var(--zhu);text-align:center;background:rgba(237,230,214,.9);
 animation:sin .5s cubic-bezier(.2,1.5,.4,1),sout .45s 1.05s forwards;}
.seal.s1{width:124px;height:124px;line-height:118px;font-size:44px;border:3px double var(--zhu);}
.seal.s2{width:88px;height:88px;line-height:82px;font-size:38px;border:2px solid var(--zhu);}
.seal.s3{width:64px;height:64px;line-height:60px;font-size:27px;border:1px solid var(--zhu);opacity:.85;}
@keyframes sin{0%{opacity:0;transform:translate(-50%,-50%) rotate(-16deg) scale(2.6)}
 100%{opacity:1;transform:translate(-50%,-50%) rotate(-9deg) scale(1)}}
@keyframes sout{to{opacity:0;transform:translate(-50%,-50%) rotate(-9deg) scale(1.12)}}

.poem{padding:14px 12px;background:rgba(34,38,43,.05);font-family:"Kaiti SC","STKaiti",serif;
 font-size:17px;line-height:2;text-align:center;letter-spacing:.08em;}
.poem b{display:block;font-size:12px;color:var(--zhu);font-weight:400;letter-spacing:.18em;margin-bottom:4px;}
.note{margin-top:13px;font-size:14px;line-height:1.85;color:#3A3E44;}
.note .t{display:block;margin-top:8px;font-size:12.5px;color:var(--ink3);}
.next{position:absolute;left:16px;right:16px;bottom:18px;background:var(--ink);color:var(--juan);border:0;padding:14px;
 font-family:"Kaiti SC","STKaiti",serif;font-size:16px;letter-spacing:.28em;cursor:pointer;}
.next.press{opacity:.82;}

.end{text-align:center;padding-top:26px;overflow-y:auto;}
.end .ttl{font-family:"Kaiti SC","STKaiti",serif;font-size:30px;color:var(--zhu);letter-spacing:.24em;margin-bottom:16px;}
.end .big{font-family:"Kaiti SC","STKaiti",serif;font-size:56px;line-height:1;}
.end .lab{font-size:11.5px;color:var(--ink3);letter-spacing:.16em;margin-top:6px;}
.rows{margin:22px 0 18px;border-top:1px solid rgba(34,38,43,.15);text-align:left;}
.row{display:flex;justify-content:space-between;padding:7px 2px;border-bottom:1px solid rgba(34,38,43,.1);font-size:14px;}
.row em{font-style:normal;color:var(--ink3);font-size:11px;}
.row em.one{color:var(--zhu);}
.btns{display:flex;gap:9px;}
.btns button{flex:1;background:none;border:1px solid rgba(34,38,43,.3);color:var(--ink);padding:12px;
 font-family:"Kaiti SC","STKaiti",serif;font-size:14px;letter-spacing:.14em;cursor:pointer;}
.btns button.dark{background:var(--ink);color:var(--juan);border-color:var(--ink);}
.btns button.press{opacity:.75;}
#rec{width:100%;height:110px;margin-top:11px;font-family:ui-monospace,monospace;font-size:10.5px;
 border:1px solid rgba(34,38,43,.25);background:#F7F3E9;padding:7px;display:none;}
.lead{text-align:center;font-family:"Kaiti SC","STKaiti",serif;font-size:16px;line-height:1.7;margin-bottom:12px;animation:fade .3s;}
.coach{flex:0 0 100%;text-align:center;font-size:13.5px;color:var(--zhu);letter-spacing:.06em;
 border:1px dashed rgba(192,57,43,.5);padding:8px 6px;margin-bottom:10px;line-height:1.6;animation:fade .25s;}
.coach.ask{animation:breath 1.6s ease-in-out infinite;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
/* 每条：k 类型 · a 答案 · p 拼音 · ic 线索图 · mp 含义 · ty 线索类型 · f 形近字[位置,错字] · fn 辨析 · sb 说白了 */
const Q={
月:[
{k:'诗句',a:'举头望明月',p:'jǔ tóu wàng míng yuè',ic:['🌕','🛏️','🧍','🏠'],mp:['月光','床前','抬起头','想家'],ty:['风景','东西','谁','东西'],f:[2,'忘'],fn:'「望」里有个月，是抬眼看；「忘」是心上没了。',sb:'抬起头，看月亮。就这么两件事。',src:'李白《静夜思》',poem:'床前明月光，疑是地上霜。<br>举头望明月，低头思故乡。',n:'夜里睡不着，看见地上一片白，以为下了霜，抬头才发现是月亮。'},
{k:'成语',a:'花好月圆',p:'huā hǎo yuè yuán',ic:['🌕','🌸','⭕'],mp:['月正圆','花正开','样样圆满'],ty:['风景','风景','做啥'],f:[3,'园'],fn:'「圆」是圆形，「园」是园子。',sb:'花开得好，月亮是圆的。都挺好。',n:'多用来祝人新婚。'},
{k:'成语',a:'众星捧月',p:'zhòng xīng pěng yuè',ic:['🌕','⭐','🙌'],mp:['月亮','满天星','星围着月'],ty:['风景','风景','做啥'],f:[2,'棒'],fn:'「捧」是提手旁，用手捧着；「棒」是木头。',sb:'星星们把月亮举起来了。',n:'许多人围着一个人转。'},
{k:'诗句',a:'小时不识月',p:'xiǎo shí bù shí yuè',ic:['🌕','👶','🍽️'],mp:['月亮','小时候','当成白玉盘'],ty:['风景','谁','东西'],f:[3,'织'],fn:'「识」是认得，「织」是织布。',sb:'小时候不认识月亮，管它叫盘子。',src:'李白《古朗月行》',poem:'小时不识月，呼作白玉盘。<br>又疑瑶台镜，飞在青云端。',n:'写诗的人小时候也曾经什么都不懂。'},
{k:'诗句',a:'明月松间照',p:'míng yuè sōng jiān zhào',ic:['🌕','🌲','💫'],mp:['月亮','松树林','照下来'],ty:['风景','东西','做啥'],f:[4,'召'],fn:'「照」下面四点是火——有光才照得亮。',sb:'月亮从松树缝里照下来。',src:'王维《山居秋暝》',poem:'空山新雨后，天气晚来秋。<br>明月松间照，清泉石上流。',n:'刚下过雨的空山，月光从松树间漏下来。'},
{k:'诗句',a:'举杯邀明月',p:'jǔ bēi yāo míng yuè',ic:['🌕','🍶','🙋'],mp:['月亮','酒杯','请它来'],ty:['风景','东西','做啥'],f:[2,'遥'],fn:'「邀」是走之底，走过去请人；「遥」是远。',sb:'举起杯子，请月亮一起喝酒。',src:'李白《月下独酌》',poem:'花间一壶酒，独酌无相亲。<br>举杯邀明月，对影成三人。',n:'一个人喝酒太闷，就把月亮和影子都请来凑成三个。'},
{k:'成语',a:'闭月羞花',p:'bì yuè xiū huā',ic:['🌕','🌸','🙈'],mp:['月亮躲起来','花也低头','太好看了'],ty:['风景','风景','做啥'],f:[2,'差'],fn:'「羞」是害羞，「差」是差别。',sb:'月亮躲了，花也不好意思了。',n:'形容人长得太好看。'},
{k:'成语',a:'水中捞月',p:'shuǐ zhōng lāo yuè',ic:['🌕','🌊','🤲'],mp:['水里的月亮','水','伸手去捞'],ty:['风景','风景','做啥'],f:[2,'劳'],fn:'「捞」是提手旁，用手捞。',sb:'在水里捞月亮。捞不着。',n:'白费力气的事。'},
{k:'成语',a:'月明星稀',p:'yuè míng xīng xī',ic:['🌕','⭐','🌌'],mp:['月亮很亮','星星很少','夜空'],ty:['风景','风景','风景'],f:[3,'希'],fn:'「稀」是禾木旁，稀少；「希」是希望。',sb:'月亮一亮，星星就看不见了。',n:'亮的东西一出来，旁边的就黯淡了。'},
{k:'成语',a:'披星戴月',p:'pī xīng dài yuè',ic:['🌕','⭐','🏃'],mp:['月亮','星星','天没亮就出门'],ty:['风景','风景','做啥'],f:[0,'批'],fn:'「披」是提手旁，披在身上；「批」是批改。',sb:'身上披着星星，头上顶着月亮，还在赶路。',n:'早出晚归，非常辛苦。'}],
鸟:[
{k:'成语',a:'惊弓之鸟',p:'jīng gōng zhī niǎo',ic:['🐦','🏹','😱'],mp:['受过伤的鸟','只拉弓不放','自己吓掉了'],ty:['谁','东西','做啥'],f:[1,'躬'],fn:'「弓」是弓箭，「躬」是弯腰。',sb:'一只被弓吓着了的鸟。弓都没射它。',n:'被吓怕过的人，一点动静就受惊。'},
{k:'诗句',a:'春眠不觉晓',p:'chūn mián bù jué xiǎo',ic:['🐦','😴','🌸','🌅'],mp:['到处鸟叫','睡得很沉','花落一地','夜里下过雨'],ty:['谁','做啥','风景','风景'],f:[1,'绵'],fn:'「眠」是目字旁——闭上眼睛才能睡。',sb:'春天睡觉，睡到不知道天亮了。',src:'孟浩然《春晓》',poem:'春眠不觉晓，处处闻啼鸟。<br>夜来风雨声，花落知多少。',n:'醒来听见鸟叫，才想起昨夜有风雨。'},
{k:'诗句',a:'千山鸟飞绝',p:'qiān shān niǎo fēi jué',ic:['🐦','⛰️','🚫','👣'],mp:['鸟','一座座山','一只不剩','也没脚印'],ty:['谁','风景','做啥','东西'],f:[4,'决'],fn:'「绝」是一点不剩，「决」是决定。',sb:'一千座山上的鸟，全飞走了，一只不剩。',src:'柳宗元《江雪》',poem:'千山鸟飞绝，万径人踪灭。<br>孤舟蓑笠翁，独钓寒江雪。',n:'鸟没了，人没了，整首诗只剩下一个钓鱼的老头。'},
{k:'成语',a:'一石二鸟',p:'yī shí èr niǎo',ic:['🐦','🐦','🪨'],mp:['一只鸟','又一只','一块石头'],ty:['谁','谁','东西'],f:[1,'矢'],fn:'「石」是石头，「矢」是箭。',sb:'一块石头，两只鸟。石头赢了。',n:'一件事办成两件。'},
{k:'诗句',a:'处处闻啼鸟',p:'chù chù wén tí niǎo',ic:['🐦','👂','🌸'],mp:['鸟','听见叫声','春天'],ty:['谁','做啥','风景'],f:[2,'问'],fn:'「闻」是耳朵在门里——听见；「问」是嘴在门里。',sb:'到处都听见鸟在叫。',src:'孟浩然《春晓》',poem:'春眠不觉晓，处处闻啼鸟。<br>夜来风雨声，花落知多少。',n:'跟「春眠不觉晓」是紧挨着的两句。'},
{k:'诗句',a:'时鸣春涧中',p:'shí míng chūn jiàn zhōng',ic:['🐦','🏞️','🌸'],mp:['鸟叫','山沟','春天'],ty:['谁','风景','风景'],f:[1,'名'],fn:'「鸣」是口字旁——鸟用嘴叫；「名」是名字。',sb:'鸟在春天的山沟里，时不时叫一声。',src:'王维《鸟鸣涧》',poem:'人闲桂花落，夜静春山空。<br>月出惊山鸟，时鸣春涧中。',n:'山太静了，静到月亮出来都能惊动鸟。'},
{k:'诗句',a:'飞鸟相与还',p:'fēi niǎo xiāng yǔ huán',ic:['🐦','🌄','🏠'],mp:['鸟','傍晚','一起回来'],ty:['谁','风景','做啥'],f:[4,'环'],fn:'「还」是走之底，回来；「环」是圆环。',sb:'鸟儿们一起飞回来了。',src:'陶渊明《饮酒》',poem:'采菊东篱下，悠然见南山。<br>山气日夕佳，飞鸟相与还。',n:'傍晚的山最好看，因为鸟都在往回飞。'},
{k:'成语',a:'笨鸟先飞',p:'bèn niǎo xiān fēi',ic:['🐦','🐌','🏃'],mp:['笨笨的鸟','飞得慢','早点出发'],ty:['谁','做啥','做啥'],f:[0,'本'],fn:'「笨」是竹字头下面一个本。',sb:'飞得慢的鸟，早点出发。',n:'知道自己慢，就比别人早动身。'},
{k:'成语',a:'鸟尽弓藏',p:'niǎo jìn gōng cáng',ic:['🐦','🏹','🗄️'],mp:['鸟打完了','弓','锁进柜子'],ty:['谁','东西','做啥'],f:[1,'进'],fn:'「尽」是完了，「进」是进去。',sb:'鸟打光了，弓就收起来了。',n:'用得着你的时候找你，用不着就放一边。'},

/* 十关固定编排：每关 3 组 × 2 题，60 题各出现一次 */
function levelPlan(L){
  const gs=[GK[L%6],GK[(L+2)%6],GK[(L+4)%6]], used={}, out=[];
  for(let l=0;l<=L;l++){
    const g3=[GK[l%6],GK[(l+2)%6],GK[(l+4)%6]];
    g3.forEach(g=>{used[g]=(used[g]||0)+1;if(l===L)out.push([g,used[g]-1]);});
  }
  return out.map(([g,k])=>[Q[g][k*2],Q[g][k*2+1]]).flat().map((q,i)=>({...q,g:gs[Math.floor(i/2)]}));
}
function lvCfg(L){return L<3?{add:2,cap:10,same:false}:L<7?{add:3,cap:13,same:false}:{add:3,cap:13,same:true};}

function tone(f,t0,d,v,ty){const o=AC.createOscillator(),g=AC.createGain();
  o.type=ty||'triangle';o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+.014);
  g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d+.05);}
function beep(k){try{
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended')AC.resume();
  const t=AC.currentTime;
  if(k==='one')[523,659,784,1047].forEach((f,i)=>tone(f,t+i*.075,.55,.2));
  else if(k==='two')[659,880].forEach((f,i)=>tone(f,t+i*.08,.42,.18));
  else if(k==='ok')tone(740,t,.32,.15);
  else if(k==='flip')tone(1180,t,.1,.06,'sine');
  else if(k==='tap')tone(880,t,.06,.05,'sine');
  else if(k==='roll')[392,523,659,784,988].forEach((f,i)=>tone(f,t+i*.11,.7,.15));
  else tone(196,t,.22,.28,'sine');}catch(e){}}

/* 开局 */
function start(L){
  const raw=levelPlan(L), qs=[];
  // 同组不相邻
  const by={};raw.forEach(q=>{(by[q.g]=by[q.g]||[]).push(q);});
  const ks=Object.keys(by);
  for(let r=0;r<2;r++)ks.forEach(g=>qs.push(by[g][r]));
  const gs=ks, cfg=lvCfg(L);
  const book=qs.map((q,i)=>({t:q.a,p:q.p,q:i}));
  const pool=sh(gs.flatMap(g=>D[g].filter(d=>!ANS.has(d[1])).map(d=>[...d,g])));
  S={mode:'game',lv:L,cfg,qs,gs,pool,book:sh(book),i:0,total:0,log:[],t0:Date.now(),lock:false};
  load();
}
function typoOf(i){const q=S.qs[i],w=q.a.split('');w[q.f[0]]=q.f[1];return w.join('');}
function grow(){
  const c=S.cfg, target=Math.min(c.cap,S.qs.length+(c.add-1)*S.i);
  if(S.i>0){
    const tp=typoOf(S.i);
    if(!S.book.some(b=>b.t===tp))S.book.push({t:tp,p:S.qs[S.i].p,q:null,typo:S.i});
  }
  let guard=0;
  while(S.book.length<target&&S.pool.length&&guard++<60){
    let k=S.pool.length-1;
    if(c.same){const j=S.pool.map((d,x)=>[d,x]).filter(([d])=>d[3]===S.L.g).pop();if(j)k=j[1];}
    const d=S.pool.splice(k,1)[0];
    if(!S.book.some(b=>b.t===d[1]))S.book.push({t:d[1],p:d[2],q:null});
  }
  sh(S.book);
}
function load(){
  S.L=S.qs[S.i];S.up=[0];S.plain=false;S.wrong=0;S.zero=false;S.stop=false;S.qt=Date.now();
  S.book.forEach(b=>{if(b.st==='out')b.st=null;});
  grow(); paint(S.L.g); draw();
}
const step=()=>S.up.length+(S.plain?1:0);
const cur=()=>S.zero?0:Math.max(FLOOR,(SCORE[step()-1]||FLOOR)-PEN*S.wrong);
function roll(from,to){const el=document.querySelector('.sc b');if(!el)return;
  const t0=performance.now();
  (function f(t){const k=Math.min(1,(t-t0)/650),e=1-Math.pow(1-k,3);
    el.textContent=Math.round(from+(to-from)*e);if(k<1)requestAnimationFrame(f);})(t0);}
function upSc(d,good,from){
  const s=document.querySelector('.sc');if(!s)return;
  s.innerHTML='<b>'+(from!=null?from:S.total)+'</b>'+
    (d?'<span class="fly" style="color:'+(good?'#2F6C7A':'#C0392B')+'">'+d+'</span>':'');
  if(from!=null)roll(from,S.total);
}
function drawGrid(){
  document.querySelector('.grid').innerHTML=S.L.ic.map((em,n)=>{
    const on=S.up.includes(n);
    return '<div class="cw"><div class="cell '+(on?'on':'hid')+'" data-c="'+n+'">'+
      (on?'<span class="em">'+em+'</span>':'<span class="q">?</span>')+
      '</div><div class="cap"></div></div>';}).join('');
  if(S.up.length>1){const f=document.querySelector('.cell[data-c="'+(S.up.length-1)+'"]');if(f)f.classList.add('fresh');}
  const pl=document.querySelector('.plain');
  if(pl){pl.className='plain'+(S.plain?' on':'');
    pl.querySelector('.pt').textContent=S.plain?(S.L.sb||''):'？';}
  const m=document.querySelector('.more');
  if(S.up.length<S.L.ic.length){m.style.display='';m.className='more';m.textContent='再翻一张线索';}
  else if(!S.plain){m.style.display='';m.className='more pl2';m.textContent='实在猜不出？看「说白了」';}
  else m.style.display='none';
}
function drawBook(){

    if(S.up.length<S.L.ic.length)S.up.push(S.up.length);else S.plain=true;

    if(S.plain){const pl=document.querySelector('.plain');if(pl)pl.classList.add('fresh');}
    return;}
  if(p)S.mode==='tut'?tutPick(+p.dataset.i,p):pick(+p.dataset.i,p);

function pick(i,node){
  const b=S.book[i];
  if(b.q!==S.i){
    S.wrong++;b.st='out';beep('bad');buzz(35);S.lock=true;
    if(S.wrong>=MAXWRONG){S.zero=true;S.up=S.L.ic.map((x,k)=>k);}
    node.classList.add('shake');
    if(b.typo===S.i){
      const bk=document.querySelector('.book'),old=bk.querySelector('.typotip');if(old)old.remove();
      const tip=document.createElement('div');tip.className='typotip';
      tip.innerHTML='<b>差 一 个 字</b>'+S.L.fn;bk.insertBefore(tip,bk.firstChild);
      setTimeout(()=>tip.remove(),4500);}
    setTimeout(()=>{node.classList.add('out');if(S.zero)drawGrid();},300);
    setTimeout(()=>{S.lock=false;},800);
    upSc('−'+PEN);return;}
  S.stop=true;b.st='done';b.gone=true;node.classList.add('hit');
  const one=step()===1&&!S.zero,g=cur(),used=S.up.length,total=S.L.ic.length;
  S.total+=g;
  S.log.push({a:S.L.a,rev:used,got:g,one,plain:S.plain,zero:S.zero,wrong:S.wrong,ms:Date.now()-S.qt});
  beep(one?'one':step()===2?'two':'ok');
  buzz(one?[40,55,40,55,90]:step()===2?[30,50,45]:30);
  if(one)document.querySelectorAll('.line:not(.hit)').forEach(el=>el.classList.add('out'));
  const s=document.createElement('div');
  s.className='seal '+(one?'s1':step()===2?'s2':'s3');
  s.textContent=one?'一眼':(step()===2?'中':'对');app.appendChild(s);
  upSc('+'+g,true,S.total-g);
  let d=560;
  for(let n=0;n<total;n++){
    if(S.up.includes(n))continue;
    setTimeout(()=>{const c=document.querySelector('.cell[data-c="'+n+'"]');
      if(c){c.className='cell on fresh';c.innerHTML='<span class="em">'+S.L.ic[n]+'</span>';beep('flip');}},d);
    d+=170;}
  setTimeout(()=>{const pl=document.querySelector('.plain');
    if(pl&&!S.plain){S.plain=true;pl.className='plain on fresh';pl.querySelector('.pt').textContent=S.L.sb||'';beep('flip');}},d);
  setTimeout(showReveal,d+520);
}
function showReveal(){
  const L=S.L;
  document.querySelector('.more').style.display='none';
  L.mp.forEach((m,i)=>setTimeout(()=>{
    const c=document.querySelectorAll('.cap')[i];if(c){c.textContent=m;c.classList.add('in');}},i*130));
  const bk=document.querySelector('.book');bk.className='book solo';
  bk.innerHTML=(L.poem?'<div class="poem"><b>'+L.src+'</b>'+L.poem+'</div>':'')+
    '<div class="note">'+(L.n||'')+'</div>'+
    '<button class="next">'+(S.i<S.qs.length-1?'下 一 题':'看 结 果')+'</button>';
}

/* 结算 */
function recText(){
  return ['图诗印谱 v3.2 试玩记录 · 第 '+(S.lv+1)+' 关','总分 '+S.total+' · 用时 '+((Date.now()-S.t0)/1000).toFixed(0)+' 秒',
   '题\t答案\t翻牌\t错\t秒\t得分',
   ...S.log.map((l,i)=>[i+1,l.a,l.rev+(l.plain?'+白话':''),l.wrong,(l.ms/1000).toFixed(1),l.got].join('\t')),
   '一眼 '+S.log.filter(l=>l.one).length+' 次 · 平均翻 '+
   (S.log.reduce((a,b)=>a+b.rev,0)/S.log.length).toFixed(2)+' 张'].join('\n');
}
function doCopy(){const t=document.getElementById('rec');t.style.display='block';t.select();
  try{document.execCommand('copy');}catch(e){}
  try{navigator.clipboard&&navigator.clipboard.writeText(t.value);}catch(e){}
  document.querySelector('.copy').textContent='已 复 制';}
function finish(){
  app.style.removeProperty('--tint');
  const rec=ld('lv',{}), ones0=S.log.filter(l=>l.one).length;
  if(!rec[S.lv]||rec[S.lv].best<S.total)rec[S.lv]={best:S.total,ones:ones0};
  sv('lv',rec);
  const avg=S.log.reduce((a,b)=>a+b.rev,0)/S.log.length,ones=S.log.filter(l=>l.one).length;
  const t=avg<=1.4?'一叶知秋':avg<=2.0?'见微知著':avg<=2.8?'循序渐进':'按图索骥';
  beep('roll');buzz([50,60,50,60,110]);
  app.innerHTML='<div class="end"><div class="lab" style="margin-bottom:8px">第 '+(S.lv+1)+' 关</div>'+
    '<div class="ttl">'+t+'</div>'+
    '<div class="big">'+S.total+'</div><div class="lab">总 分</div>'+
    '<div class="lab" style="margin-top:10px">一眼 '+ones+' 次 · 平均翻 '+avg.toFixed(1)+' 张图</div>'+
    '<div class="rows">'+S.log.map(l=>'<div class="row"><span>'+l.a+'</span><em class="'+(l.one?'one':'')+'">'+
      (l.zero?'0 分':(l.one?'一眼 · ':l.rev+' 张'+(l.plain?'+白话':'')+' · ')+l.got+' 分')+'</em></div>').join('')+
    '</div><div class="btns"><button class="copy">复制记录</button>'+
    '<button class="again">关卡表</button>'+
    (S.lv<NLV-1?'<button class="dark nextlv">下 一 关</button>':'<button class="dark again">通 关 了</button>')+'</div>'+
    '<textarea id="rec" readonly>'+recText()+'</textarea></div>';
}
home();

</script>
</body>
</html>
