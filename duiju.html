<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>降字妖 · 纸上战</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
:root{--paper:#ede3cd;--paper2:#e3d7bd;--ink:#1b1916;--ink2:#4a443b;--faint:#8d8471;
      --line:#c9bb9c;--cin:#a8322a;--gold:#b8892b;--jade:#2c6b4f;--chang:#2f5f96;--duan:#c25a1e}
html,body{height:100%;overflow:hidden}
body{font-family:"STKaiti","KaiTi","Kaiti SC","PingFang SC","Songti SC",serif;background:#d9cdb2;color:var(--ink);display:flex;justify-content:center}
#app{width:100%;max-width:440px;height:100dvh;display:flex;flex-direction:column;position:relative;background:var(--paper);overflow:hidden}
#app.quake{animation:quake .4s}
@keyframes quake{0%,100%{transform:translate(0)}12%{transform:translate(-7px,4px)}28%{transform:translate(6px,-3px)}
 45%{transform:translate(-5px,-4px)}62%{transform:translate(4px,3px)}80%{transform:translate(-2px,1px)}}

.sky{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.sky .grain{position:absolute;inset:0;opacity:.5;
  background-image:radial-gradient(circle at 15% 20%,rgba(120,105,80,.16) 0 1px,transparent 2px),
                   radial-gradient(circle at 62% 47%,rgba(120,105,80,.13) 0 1px,transparent 2px),
                   radial-gradient(circle at 84% 76%,rgba(120,105,80,.15) 0 1px,transparent 2px);
  background-size:37px 41px,53px 47px,61px 59px}
.wash{position:absolute;border-radius:50%;filter:blur(22px);opacity:.16;animation:breathe 9s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.13;transform:scale(1)}50%{opacity:.21;transform:scale(1.07)}}
.w1{width:230px;height:170px;left:-60px;top:20px;background:#3a3428}
.w2{width:200px;height:150px;right:-56px;top:110px;background:#2e3a3a;animation-delay:-3s}
.w3{width:260px;height:130px;left:20px;bottom:110px;background:#3a2e30;animation-delay:-6s}
.hills{position:absolute;left:0;right:0;top:150px;opacity:.18}
.dark{position:absolute;inset:0;pointer-events:none;z-index:3;opacity:0;transition:opacity .8s;
  background:radial-gradient(ellipse at 50% 45%,transparent 30%,rgba(20,16,10,.6) 100%)}

.top{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;
  padding:7px 16px 0;font-size:12px;color:var(--ink2);letter-spacing:1px}
.top b{font-size:15px;color:var(--ink)}
.combo{color:var(--cin);font-weight:bold;font-size:15px;transition:transform .2s}
.combo.pop{transform:scale(1.5)}

/* ---------- 妖：血槽在头顶 ---------- */
.field{position:relative;z-index:5;display:flex;flex-direction:column;align-items:center;padding-top:2px}
.mname{font-size:11.5px;color:var(--ink2);letter-spacing:2px}
.mname span{color:var(--cin)}
.hpwrap{position:relative;width:172px;height:13px;margin:2px 0 1px;border:2px solid var(--ink);border-radius:3px;background:#d6c8a9;overflow:hidden}
.hpghost{position:absolute;inset:0;background:#e8dcc0;width:100%;transition:width .8s ease .25s}
.hpbar{position:absolute;inset:0;background:linear-gradient(180deg,#b5453a,#8d2620);width:100%;transition:width .35s cubic-bezier(.3,1.4,.4,1)}
.hpwrap.low .hpbar{animation:lowp .7s ease-in-out infinite}
@keyframes lowp{0%,100%{filter:brightness(1)}50%{filter:brightness(1.5)}}
.hptick{position:absolute;top:0;bottom:0;width:1px;background:rgba(27,25,22,.35)}
.monwrap{position:relative;width:158px;height:118px;display:flex;align-items:center;justify-content:center}
.mon{width:100%;height:100%;animation:bob 3.1s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-8px) rotate(.8deg)}}
.mon.hit{animation:mhit .45s}
@keyframes mhit{0%,100%{transform:translate(0) scale(1)}12%{transform:translate(-13px,5px) scale(1.07,.92)}
 34%{transform:translate(11px,-4px) scale(.93,1.08)}58%{transform:translate(-7px,2px)}78%{transform:translate(4px,-1px)}}
.mon.dead{animation:mdie 1s forwards}
@keyframes mdie{40%{transform:scale(1.16) rotate(8deg);opacity:.9}100%{transform:scale(.15) rotate(-40deg);opacity:0;filter:blur(6px)}}
.mon.spit{animation:mspit .55s}
@keyframes mspit{0%,100%{transform:scale(1)}25%{transform:scale(1.16,.86)}55%{transform:scale(.9,1.12)}}
.crk{opacity:0;transition:opacity .5s}.crk.on{opacity:1}
.dmg{position:absolute;top:8px;left:50%;font-size:30px;font-weight:bold;color:var(--cin);opacity:0;pointer-events:none;text-shadow:2px 2px 0 var(--paper);z-index:6}
.dmg.show{animation:dm 1.05s ease-out forwards}
@keyframes dm{0%{opacity:0;transform:translate(-50%,10px) scale(.5)}18%{opacity:1;transform:translate(-50%,-8px) scale(1.35)}100%{opacity:0;transform:translate(-50%,-48px) scale(1)}}
.drop{position:absolute;border-radius:50%;background:var(--ink);pointer-events:none;opacity:0}
.drop.go{animation:dp .62s cubic-bezier(.15,.8,.4,1) forwards}
@keyframes dp{0%{opacity:.95;transform:translate(0,0) scale(.4)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.15)}}
.shock{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;border:3px solid var(--ink);opacity:0;pointer-events:none}
.shock.go{animation:sk .5s ease-out forwards}
@keyframes sk{0%{opacity:.75;transform:scale(.4)}100%{opacity:0;transform:scale(7)}}

/* ---------- 对话：上句气泡 / 判定 / 下句气泡 ---------- */
.clash{position:relative;z-index:5;flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;padding:0 8px}
.bwrap{display:flex;justify-content:center;position:relative}
.bub{position:relative;display:inline-flex;align-items:flex-start;gap:4px;padding:9px 12px 7px;border-radius:15px;border:2.5px solid var(--ink)}
.bub.up{background:#fffdf6;box-shadow:3px 4px 0 rgba(27,25,22,.14)}
.bub.up::after{content:"";position:absolute;top:-13px;left:50%;margin-left:-10px;border:10px solid transparent;border-bottom-color:var(--ink);border-top:0}
.bub.up::before{content:"";position:absolute;top:-9px;left:50%;margin-left:-8px;border:8px solid transparent;border-bottom-color:#fffdf6;border-top:0;z-index:1}
.bub.dn{background:#fdf2ec;border-color:var(--cin);box-shadow:3px 4px 0 rgba(168,50,42,.16)}
.bub.dn::after{content:"";position:absolute;bottom:-13px;left:50%;margin-left:-10px;border:10px solid transparent;border-top-color:var(--cin);border-bottom:0}
.bub.dn::before{content:"";position:absolute;bottom:-9px;left:50%;margin-left:-8px;border:8px solid transparent;border-top-color:#fdf2ec;border-bottom:0;z-index:1}
.bub.up.recoil{animation:rec .5s}
@keyframes rec{0%,100%{transform:translateY(0)}38%{transform:translateY(-17px)}68%{transform:translateY(4px)}}
.bub.dn.lunge{animation:lun .5s}
@keyframes lun{0%,100%{transform:translateY(0)}34%{transform:translateY(-36px)}56%{transform:translateY(-28px)}}
.who{position:absolute;top:-11px;left:12px;font-size:10px;letter-spacing:2px;background:var(--paper);padding:0 6px;color:var(--ink2)}
.bub.dn .who{top:auto;bottom:-11px;color:var(--cin)}
.cat{position:absolute;top:-11px;right:10px;font-size:10px;color:#fff;padding:1px 8px;border-radius:8px;letter-spacing:1px}
.bub.dn .cat{top:auto;bottom:-11px}

.cell{display:flex;flex-direction:column;align-items:center;gap:2px}
.gbox{display:flex;align-items:center;justify-content:center;border:1.5px dashed rgba(27,25,22,.24);border-radius:5px;line-height:1;
  background-image:linear-gradient(to right,transparent 49.4%,rgba(27,25,22,.09) 49.4% 50.6%,transparent 50.6%),
                   linear-gradient(to bottom,transparent 49.4%,rgba(27,25,22,.09) 49.4% 50.6%,transparent 50.6%)}
.bub.dn .gbox{border-color:rgba(168,50,42,.3);color:var(--cin)}
.bub.dn.empty .gbox{color:#d3c4a6}
.cell .tn{font-size:11px;color:var(--faint);height:12px;line-height:1}
.cell .br{height:5px;border-radius:3px}
.bub.up .cell{animation:spit .55s cubic-bezier(.2,1.25,.4,1) backwards}
@keyframes spit{from{opacity:0;transform:translateY(-70px) scale(.3) rotate(-14deg)}to{opacity:1;transform:none}}
.gbox.slot{border-style:solid;border-color:var(--line);background-color:rgba(255,253,246,.55)}
.gbox.slot.open{border-color:var(--cin);border-width:2px;animation:pulse 1.7s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(168,50,42,0)}50%{box-shadow:0 0 0 4px rgba(168,50,42,.15)}}
.gbox.slot.lock{background-color:rgba(198,184,152,.5);border-style:dashed}
.gbox.slot.lock+.tn{color:var(--faint)}
.slab{font-size:9px;color:var(--faint);height:11px;line-height:1}
.cell.op .slab{color:var(--cin)}

.goal{display:flex;align-items:center;justify-content:center;gap:6px;height:22px;font-size:12.5px;color:var(--ink2);letter-spacing:1px}
.goal .k{font-size:10px;color:var(--faint);letter-spacing:3px}
.goal b{font-size:15px}.goal .cg{color:var(--chang)}.goal .dg{color:var(--duan)}
.goal .chip{font-size:11px;color:#fff;padding:2px 8px;border-radius:9px}

.judge{position:relative;display:flex;align-items:center;justify-content:center;gap:4px;height:24px}
.mk{text-align:center;font-size:16px;line-height:24px}
.mk.ok{color:var(--jade)}.mk.no{color:var(--cin);font-weight:bold}.mk.na{color:#bfb192;font-size:12px}
.mk.fog{color:#8d8471;font-size:14px}
.seal{position:absolute;right:2px;top:50%;transform:translateY(-50%) rotate(-9deg) scale(.35);
  border:3px solid var(--cin);color:var(--cin);border-radius:6px;padding:2px 5px;font-size:11px;line-height:1.1;
  text-align:center;background:rgba(237,227,205,.92);opacity:0;letter-spacing:1px}
.seal.on{animation:seal .45s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes seal{to{opacity:1;transform:translateY(-50%) rotate(-9deg) scale(1)}}
.seal.grey{border-color:#7d7566;color:#7d7566}
.seal b{display:block;font-size:15px}

/* ---------- 玩家一侧：灯 + 长老 ---------- */
.pbar{position:relative;z-index:5;display:flex;align-items:stretch;gap:7px;margin:4px 10px 2px;
  background:rgba(255,252,244,.86);border:1.5px solid var(--line);border-radius:10px;padding:5px 8px;min-height:52px}
.lampbox{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
  width:52px;border-right:1.5px dashed var(--line);padding-right:5px}
.lamp{width:30px;height:38px}
.flame{transform-origin:50% 100%;animation:flick 1.1s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1,1) rotate(-2deg)}35%{transform:scale(.88,1.13) rotate(3deg)}70%{transform:scale(1.06,.93) rotate(-3deg)}}
.lampbox.dying .flame{animation:flick2 .26s ease-in-out infinite}
@keyframes flick2{0%,100%{transform:scale(.6,.7) rotate(-13deg);opacity:.75}50%{transform:scale(.9,1.2) rotate(12deg);opacity:1}}
.oilfill{transition:height .5s ease,y .5s ease}
.pips{display:flex;gap:3px;margin-top:1px}
.pip{width:6px;height:8px;border-radius:50% 50% 40% 40%;background:var(--gold)}
.pip.off{background:#c9bb9c;opacity:.5}
.olab{font-size:8.5px;color:var(--faint);letter-spacing:1px;margin-top:1px}
.lampbox.dying .olab{color:var(--cin)}
.elder{display:flex;gap:7px;align-items:flex-start;flex:1;padding-top:1px}
.face{width:27px;height:27px;border-radius:50%;background:var(--paper2);border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.say{flex:1}
.say .l1{font-size:14px;font-weight:bold;line-height:1.35;color:var(--ink)}
.say .l2{font-size:11.5px;line-height:1.45;color:var(--faint);margin-top:1px}
.say i{font-style:normal;color:var(--chang)}.say u{text-decoration:none;color:var(--duan)}.say em{font-style:normal;color:var(--cin)}

/* ---------- 手牌 / 字库 ---------- */
.hand{position:relative;z-index:5;display:flex;gap:5px;padding:2px 8px;justify-content:center;align-items:flex-end;min-height:92px}
.card{flex:1;max-width:78px;min-height:84px;background:linear-gradient(180deg,#f4ecd9,#e6dabf);border:2px solid var(--ink);
  border-bottom-width:5px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:5px 3px;box-shadow:2px 3px 0 rgba(27,25,22,.13);animation:float 3.4s ease-in-out infinite;
  transition:transform .15s,box-shadow .15s,opacity .3s,border-color .15s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.card:active{transform:translateY(-6px)}
.card.sel{border-color:var(--cin);box-shadow:0 0 0 3px rgba(168,50,42,.2),2px 3px 0 rgba(27,25,22,.13);transform:translateY(-10px);animation:none}
.card .t{font-size:20px;writing-mode:vertical-rl;line-height:1.15}
.card.l3 .t{font-size:17px}
.card .bars{display:flex;gap:3px}.card .bb{height:4px;border-radius:2px}
.card .cn{font-size:9.5px;color:#fff;padding:1px 6px;border-radius:7px}
.card.gone{opacity:0;transform:translateY(-64px) scale(.7) rotate(9deg);animation:none}
.card.dim{opacity:.24;animation:none}
.card.cut{opacity:.2;border-style:dashed;pointer-events:none;position:relative;animation:none}
.card.cut::after{content:"✕";position:absolute;font-size:28px;color:var(--cin);opacity:.6}
.trays{position:relative;z-index:5;padding:0 8px}
.tray{display:flex;align-items:center;gap:5px;margin-bottom:3px;opacity:.4;transition:opacity .25s}
.tray.active{opacity:1}
.tray .tl{width:26px;flex:none;font-size:10px;color:var(--cin);writing-mode:vertical-rl;letter-spacing:2px;text-align:center}
.tray .row{display:flex;gap:4px;flex:1;justify-content:center}
.gz{width:41px;height:42px;background:linear-gradient(180deg,#f4ecd9,#e6dabf);border:2px solid var(--ink);border-bottom-width:3px;
  border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:1px 2px 0 rgba(27,25,22,.12)}
.gz:active{transform:translateY(-3px)}
.gz .g{font-size:18px;line-height:1}.gz .bb{height:4px;border-radius:2px;margin-top:3px}
.gz.used{opacity:.16;pointer-events:none}

.act{position:relative;z-index:5;display:flex;justify-content:center;gap:9px;padding:3px 0 8px;min-height:46px;align-items:center}
.act button{padding:9px 26px;border:2px solid var(--ink);background:var(--cin);color:#fbf6ea;font-family:inherit;
  font-size:16px;border-radius:6px;letter-spacing:3px;box-shadow:2px 3px 0 rgba(27,25,22,.3)}
.act button:active:not(:disabled){transform:translate(2px,3px);box-shadow:none}
.act button:disabled{opacity:.3;background:none;color:var(--ink2);box-shadow:none}
.act .aux{padding:9px 12px;background:#e6dabf;color:var(--ink);font-size:12.5px;letter-spacing:0}

/* ---------- 结算幕 ---------- */
.curtain{position:absolute;left:0;right:0;bottom:0;z-index:12;background:var(--paper);border-top:3px solid var(--ink);
  box-shadow:0 -5px 0 rgba(27,25,22,.12);padding:11px 15px 13px;transform:translateY(105%);transition:transform .4s cubic-bezier(.2,1.15,.4,1)}
.curtain.up{transform:translateY(0)}
.curtain .row1{display:flex;align-items:center;gap:11px}
.cstamp{flex:none;width:60px;height:60px;border:3px solid var(--cin);border-radius:8px;color:var(--cin);
  display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-8deg)}
.cstamp .s{font-size:16px;letter-spacing:-1px}.cstamp .n{font-size:12px;margin-top:1px}
.cstamp.grey{border-color:#7d7566;color:#7d7566}
.ctxt{flex:1}.ctxt .ct{font-size:19px;color:var(--ink);line-height:1.25}
.chp{font-size:12px;color:var(--cin);margin-left:6px}
.why{margin-top:8px;background:#f7f0de;border:1.5px solid var(--line);border-radius:8px;padding:6px 9px}
.wl{display:flex;align-items:center;gap:6px;font-size:12.5px;line-height:1.75;color:var(--ink2)}
.wl .t{color:var(--ink);font-size:14px}
.wl .v{margin-left:auto;font-size:14px}
.wl .v.ok{color:var(--jade)}.wl .v.no{color:var(--cin);font-weight:bold}
.wsum{margin-top:4px;padding-top:4px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--ink);text-align:center}
.wsum b{color:var(--cin)}
.cfix{margin-top:7px;background:#fdf2ec;border:1.5px dashed var(--cin);border-radius:8px;padding:6px 9px;font-size:13px;line-height:1.5;color:var(--ink)}
.cfix b{color:var(--cin)}
.curtain .cbtn{display:flex;justify-content:center;gap:9px;margin-top:9px}
.curtain .cbtn button{padding:9px 28px;border:2px solid var(--ink);background:var(--cin);color:#fbf6ea;font-family:inherit;
  font-size:16px;border-radius:6px;letter-spacing:3px;box-shadow:2px 3px 0 rgba(27,25,22,.3)}
.curtain .cbtn .ghost{background:#e6dabf;color:var(--ink)}
.say i,.wl i{font-style:normal;color:var(--chang)}.wl u{text-decoration:none;color:var(--duan)}

/* ---------- 口诀卡 / 结果 ---------- */
.veil{position:absolute;inset:0;background:rgba(24,20,14,.68);display:none;align-items:center;justify-content:center;padding:22px;z-index:20}
.veil.show{display:flex;animation:fd .3s}
@keyframes fd{from{opacity:0}to{opacity:1}}
.panel{background:var(--paper);border:3px double var(--cin);border-radius:10px;padding:0 0 18px;text-align:center;
  width:100%;max-width:312px;box-shadow:5px 7px 0 rgba(20,16,10,.35);overflow:hidden}
.jhead{background:#e0d2b4;border-bottom:2px solid var(--line);padding:7px 0 6px}
.jhead .lv{font-size:10px;color:var(--ink2);letter-spacing:6px}
.jtt{font-size:31px;color:var(--cin);margin:16px 0 2px;letter-spacing:2px;line-height:1.15}
.jsub{font-size:11px;color:var(--faint);letter-spacing:3px;margin-bottom:14px}
.jdemo{margin:0 18px 14px;background:#f7f0de;border:1.5px solid var(--line);border-radius:8px;padding:12px 8px}
.jdemo .big{font-size:26px;letter-spacing:2px;line-height:1.3}
.jdemo .lab{font-size:11px;color:var(--faint);margin-top:5px;letter-spacing:1px}
.jdemo i{font-style:normal;color:var(--chang)}.jdemo u{text-decoration:none;color:var(--duan)}
.jdemo .op{color:var(--faint);font-size:16px;margin:0 8px}
.jds{font-size:13px;color:var(--ink2);line-height:1.85;padding:0 20px}
.jds i{font-style:normal;color:var(--chang);font-weight:bold}
.jds u{text-decoration:none;color:var(--duan);font-weight:bold}
.jds em{font-style:normal;color:var(--cin);font-weight:bold}
.panel button{margin-top:15px;padding:9px 26px;border:2px solid var(--ink);background:var(--cin);color:#fbf6ea;
  font-family:inherit;font-size:16px;border-radius:6px;letter-spacing:3px;box-shadow:2px 3px 0 rgba(27,25,22,.3)}
.pwrap{padding:16px 0 0}
.caught{font-size:56px;margin:4px 0;color:var(--ink);animation:cpop .7s cubic-bezier(.2,1.5,.4,1)}
@keyframes cpop{0%{transform:scale(0) rotate(-40deg);filter:blur(8px)}100%{transform:none;filter:none}}
.result{position:absolute;inset:0;background:var(--paper);display:none;flex-direction:column;align-items:center;padding:18px 16px;overflow-y:auto;z-index:19}
.result.show{display:flex;animation:fd .4s}
.result .rank{font-size:44px;color:var(--cin);margin:4px 0}
.result .num{font-size:13px;color:var(--ink2);line-height:1.9;margin-bottom:10px;text-align:center}
.book{width:100%;border-top:1px solid var(--line);padding-top:6px}
.book h4{font-size:11.5px;color:var(--faint);letter-spacing:3px;font-weight:normal;margin:8px 0;text-align:center}
.bi{display:flex;justify-content:center;align-items:center;gap:8px;font-size:15px;padding:2px 0}
.bi small{font-size:10.5px;color:var(--gold)}
.jt{font-size:11px;border:1px solid var(--cin);color:var(--cin);padding:3px 9px;border-radius:11px;margin:3px;display:inline-block}
.btn{margin:16px 0 10px;padding:10px 30px;border:2px solid var(--ink);background:none;font-family:inherit;font-size:16px;color:var(--ink);border-radius:5px}

/* ================= 卷轴外框 ================= */
#app{padding:0}
.roller{position:absolute;left:0;right:0;height:20px;z-index:30;pointer-events:none;
  background:linear-gradient(180deg,#8a6a42,#5d4527 40%,#3d2c18 70%,#6b5030);
  border-top:1px solid #2a1d10;border-bottom:1px solid #2a1d10;
  box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.roller::before,.roller::after{content:"";position:absolute;top:-4px;width:15px;height:28px;border-radius:4px;
  background:linear-gradient(180deg,#a8834f,#5d4527 55%,#3a2a16);border:1px solid #241a0e}
.roller::before{left:-5px}.roller::after{right:-5px}
.roller.t{top:0}.roller.b{bottom:0}
.silk{position:absolute;left:0;right:0;height:7px;z-index:29;pointer-events:none;
  background:repeating-linear-gradient(90deg,#9d7b52 0 5px,#8a6a45 5px 10px);opacity:.85}
.silk.t{top:20px}.silk.b{bottom:20px}
.inner{position:absolute;left:0;right:0;top:27px;bottom:27px;display:flex;flex-direction:column;overflow:hidden}

/* ================= 画境层 ================= */
.scene{position:absolute;inset:0;z-index:0;overflow:hidden;background:#ede3cd}
.scene .img{position:absolute;inset:-8px;background-size:cover;background-position:center;
  opacity:0;transition:opacity .9s;animation:drift 26s ease-in-out infinite alternate}
.scene .img.on{opacity:1}
@keyframes drift{from{transform:scale(1.03) translate(-4px,-3px)}to{transform:scale(1.09) translate(5px,4px)}}
.scene svg.vec{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .9s}
.scene svg.vec.on{opacity:1}
.pl1{animation:px1 20s ease-in-out infinite alternate}
.pl2{animation:px2 16s ease-in-out infinite alternate}
.pl3{animation:px3 12s ease-in-out infinite alternate}
@keyframes px1{from{transform:translateX(-7px)}to{transform:translateX(7px)}}
@keyframes px2{from{transform:translateX(10px)}to{transform:translateX(-10px)}}
@keyframes px3{from{transform:translate(-13px,3px)}to{transform:translate(13px,-3px)}}
.scene .veilw{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 46%,rgba(247,241,226,.30) 0%,rgba(247,241,226,.10) 55%,rgba(30,24,14,.20) 100%)}
.motes{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.mote{position:absolute;border-radius:50%;background:rgba(255,255,255,.6);animation:fly linear infinite}
@keyframes fly{from{transform:translate(0,110%)}to{transform:translate(30px,-15%)}}

/* ================= 木牌手感 ================= */
.card,.gz{background:linear-gradient(180deg,#e6cfa4 0%,#d9be8c 42%,#caa870 100%);
  border-color:#4a331b;box-shadow:inset 0 1px 0 rgba(255,246,225,.6),inset 0 -3px 5px rgba(90,62,30,.32),2px 4px 0 rgba(35,24,12,.4)}
.card::before,.gz::before{content:"";position:absolute;inset:3px;border-radius:5px;pointer-events:none;
  background:repeating-linear-gradient(92deg,rgba(120,86,42,.13) 0 1px,transparent 1px 6px),
             repeating-linear-gradient(88deg,rgba(120,86,42,.09) 0 1px,transparent 1px 11px)}
.card{position:relative}.gz{position:relative}
.card .t{color:#2c1d0c;text-shadow:0 1px 0 rgba(255,246,225,.5)}
.gz .g{color:#2c1d0c;text-shadow:0 1px 0 rgba(255,246,225,.5)}
.card.sel{box-shadow:0 0 0 3px rgba(168,50,42,.35),inset 0 -3px 5px rgba(90,62,30,.3),2px 4px 0 rgba(35,24,12,.4)}

/* ================= 通用覆盖屏 ================= */
.screen{position:absolute;inset:0;z-index:25;display:none;flex-direction:column;align-items:center;justify-content:center;
  background:#ede3cd;overflow:hidden}
.screen.on{display:flex}
.screen .bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.85}
.screen .fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(237,227,205,.5),rgba(237,227,205,.9))}
.screen .body{position:relative;z-index:2;width:100%;display:flex;flex-direction:column;align-items:center;padding:18px}
.skip{position:absolute;top:8px;right:10px;z-index:5;font-size:11px;color:var(--ink2);border:1px solid var(--line);
  border-radius:12px;padding:3px 10px;background:rgba(255,252,244,.8)}

/* 冷开场 */
.intro-title{font-size:13px;letter-spacing:8px;color:var(--ink2);opacity:0;transition:.7s}
.intro-title.on{opacity:1}
.iyao{width:150px;height:118px;transition:transform .6s;filter:drop-shadow(2px 3px 0 rgba(27,25,22,.2))}
.iyao.lunge{transform:translate(-58px,44px) scale(1.12) rotate(-9deg)}
.iword{position:absolute;font-size:60px;color:var(--ink);transition:.55s cubic-bezier(.3,1.2,.4,1);
  text-shadow:2px 3px 0 rgba(27,25,22,.16)}
.iword.eaten{transform:translate(46px,-40px) scale(.15) rotate(30deg);opacity:0}
.iword.back{transform:translate(-70px,120px) scale(.5);opacity:0}

/* 选笔 */
.pens{display:flex;gap:9px;margin-top:14px}
.pen{flex:1;background:linear-gradient(180deg,#f6efdd,#e6dabf);border:2px solid var(--ink);border-radius:10px;
  padding:12px 6px 10px;text-align:center;box-shadow:2px 3px 0 rgba(27,25,22,.25);transition:.15s}
.pen:active{transform:translateY(-4px)}
.pen.sel{border-color:var(--cin);box-shadow:0 0 0 3px rgba(168,50,42,.2),2px 3px 0 rgba(27,25,22,.25)}
.pen .pn{font-size:19px;margin-top:6px}
.pen .pd{font-size:11px;color:var(--ink2);line-height:1.5;margin-top:4px}
.pen svg{width:26px;height:64px}

/* 长卷地图 */
.mapwrap{position:relative;width:100%;height:212px;overflow:hidden;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);
  background:#e3d7bd}
.mapstrip{position:absolute;top:0;bottom:0;left:0;display:flex;transition:transform .9s cubic-bezier(.3,1,.4,1)}
.mpanel{width:220px;height:100%;position:relative;background-size:cover;background-position:center;border-right:1px dashed rgba(60,45,25,.3)}
.mpanel .nm{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:12px;color:#fff;letter-spacing:3px;
  text-shadow:0 1px 3px rgba(0,0,0,.7)}
.node{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;
  border:2.5px solid var(--ink);background:rgba(255,252,244,.9);display:flex;align-items:center;justify-content:center;
  font-size:22px;color:var(--ink);box-shadow:2px 3px 0 rgba(27,25,22,.3)}
.node.done{background:var(--cin);color:#fbf6ea;border-color:#5d1c16}
.node.now{animation:npulse 1.5s ease-in-out infinite}
@keyframes npulse{0%,100%{box-shadow:0 0 0 0 rgba(168,50,42,.5),2px 3px 0 rgba(27,25,22,.3)}
 50%{box-shadow:0 0 0 11px rgba(168,50,42,0),2px 3px 0 rgba(27,25,22,.3)}}
.mroad{position:absolute;left:0;right:0;top:44%;height:3px;background:repeating-linear-gradient(90deg,rgba(60,45,25,.5) 0 7px,transparent 7px 14px)}

/* 字帖结算 */
.tie{position:relative;background:linear-gradient(180deg,#fbf4e2,#f0e6cd);border:2px solid var(--ink);
  padding:16px 12px 14px;box-shadow:3px 5px 0 rgba(27,25,22,.25);max-width:340px;width:100%}
.tie .hd{text-align:center;font-size:12px;letter-spacing:6px;color:var(--ink2);border-bottom:1px solid var(--line);padding-bottom:7px}
.cols{display:flex;justify-content:center;gap:6px;padding:12px 0 6px;flex-wrap:wrap}
.col{writing-mode:vertical-rl;font-size:17px;line-height:1.5;letter-spacing:3px;padding:5px 3px;border-left:1px dotted var(--line);
  max-height:186px;color:var(--ink)}
.col.g{color:var(--cin)}
.seal{position:absolute;right:12px;bottom:10px;width:44px;height:44px;border:2.5px solid var(--cin);border-radius:4px;
  color:var(--cin);display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1.05;text-align:center;
  transform:rotate(-7deg);background:rgba(251,244,226,.6)}
.kuan{font-size:11px;color:var(--ink2);text-align:right;padding-right:62px;letter-spacing:1px}


/* ============ 半透明 UI：让画境透出来 ============ */
.bub.up{background:rgba(255,253,246,.76);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.bub.up::before{border-bottom-color:rgba(255,253,246,.9)}
.bub.dn{background:rgba(253,242,236,.76);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.bub.dn::before{border-top-color:rgba(253,242,236,.9)}
.pbar{background:rgba(255,252,244,.68);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.hpwrap{background:rgba(214,200,169,.85)}
.mname{color:#2b261f;text-shadow:0 1px 3px rgba(247,241,226,.9),0 0 8px rgba(247,241,226,.7)}
.top{color:#2b261f;text-shadow:0 1px 3px rgba(247,241,226,.85)}
.top b{text-shadow:0 1px 3px rgba(247,241,226,.85)}

/* ============ 目标带：主视觉 ============ */
.goal{height:auto;padding:5px 0 3px}
.ribbon{display:inline-flex;align-items:center;gap:8px;padding:5px 15px;border:2.5px solid var(--cin);
  border-radius:22px;background:rgba(253,240,232,.94);box-shadow:2px 3px 0 rgba(168,50,42,.28);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.ribbon .rk{font-size:11px;letter-spacing:3px;color:var(--cin);opacity:.8}
.ribbon .rv{font-size:19px;font-weight:bold;color:var(--ink);display:inline-flex;align-items:center;gap:6px;letter-spacing:1px}
.ribbon .rc{font-size:12px;color:#fff;padding:3px 10px;border-radius:10px}
.ribbon .rx{font-size:11px;color:var(--ink2)}
.rbar{display:inline-block;height:7px;border-radius:4px}
.rbar.c{width:34px;background:var(--chang)}
.rbar.d{width:12px;background:var(--duan)}

/* 字格：去掉声调行之后收紧 */
.cell{gap:4px}

/* 冷开场旁白框 */
.ibub{max-width:300px;background:rgba(255,253,246,.92);border:2px solid var(--ink);border-radius:12px;
  padding:10px 14px;font-size:14px;line-height:1.65;text-align:center;box-shadow:2px 3px 0 rgba(27,25,22,.2);
  opacity:0;transform:translateY(8px);transition:.3s;align-self:flex-start}
.ibub.on{opacity:1;transform:none}
.ibub b{color:var(--cin)}.ibub i{font-style:normal;color:var(--chang);font-weight:bold}
.ibub u{text-decoration:none;color:var(--duan);font-weight:bold}

/* 再念一遍 */
.again{font-size:11.5px;color:var(--ink);border:1.5px solid var(--ink);border-radius:13px;
  padding:3px 10px;background:rgba(255,250,235,.85);letter-spacing:1px;box-shadow:1px 2px 0 rgba(27,25,22,.22)}
.again:active{transform:translate(1px,2px);box-shadow:none}
.top{padding:8px 12px 0}
/* 妖发狂（纯表现，不改数值） */
.mon.rage{animation:bob 1.05s ease-in-out infinite}
.hpwrap.low{border-color:var(--cin)}
/* 长卷上的妖气条 */
.mpanel .hpmini{position:absolute;left:22px;right:22px;bottom:26px;height:7px;border:1.5px solid #1b1916;
  border-radius:3px;background:rgba(240,232,210,.75);overflow:hidden}
.mpanel .hpmini i{display:block;height:100%;background:#a8322a}
.sessline{font-size:12px;color:var(--ink2);text-align:center;line-height:1.7;margin-top:8px}
.sessline b{color:var(--cin)}

/* ---- 牌库 ---- */
.deckinfo{position:absolute;right:10px;top:-9px;font-size:10px;color:var(--ink2);
  background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:1px 8px;letter-spacing:1px}
.hand{position:relative}
/* 缠绕 */
.card.snared{pointer-events:none;filter:grayscale(.5)}
.card.snared::after{content:"";position:absolute;inset:-2px;border-radius:8px;pointer-events:none;
  background:repeating-linear-gradient(48deg,rgba(92,43,66,.85) 0 5px,transparent 5px 13px);
  border:2px solid #5c2b42}
.card.snared::before{opacity:.3}
.snaretag{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-8deg);
  font-size:11px;color:#fff;background:#5c2b42;padding:2px 7px;border-radius:9px;z-index:3;white-space:nowrap}
/* 全力一击 */
.allin{padding:9px 12px;background:#e6dabf;color:var(--ink);border:2px solid var(--ink);border-radius:6px;
  font-family:inherit;font-size:12.5px;box-shadow:2px 3px 0 rgba(27,25,22,.3)}
.allin.on{background:#7a2b22;color:#ffe9c9;border-color:#3d1410}
.allin.on::after{content:" ×2"}
/* 法宝 */
.relics{display:flex;gap:5px;align-items:center;padding:0 10px 2px;position:relative;z-index:5;justify-content:center}
.relic{width:38px;height:38px;border:2px solid var(--ink);border-radius:8px;background:linear-gradient(180deg,#f2e2c0,#dcc79c);
  display:flex;align-items:center;justify-content:center;font-size:20px;color:#2c1d0c;
  box-shadow:1px 2px 0 rgba(27,25,22,.3);position:relative}
.relic:active{transform:translateY(-3px)}
.relic.used{opacity:.22;pointer-events:none}
.relic .rt{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);font-size:8.5px;
  background:var(--cin);color:#fff;padding:0 5px;border-radius:6px;white-space:nowrap}
.relichint{font-size:10.5px;color:var(--ink2);margin-left:4px}

/* ---- 全力一击：开关 ---- */
.airow{flex-basis:100%;display:flex;justify-content:center;order:-1;margin-bottom:2px}
.aisw{display:inline-flex;align-items:center;gap:7px;padding:5px 12px 5px 6px;border:2px solid var(--line);
  border-radius:20px;background:rgba(255,250,235,.9);box-shadow:1px 2px 0 rgba(27,25,22,.18)}
.aisw .knob{width:30px;height:17px;border-radius:10px;background:#cfc0a2;position:relative;flex:none;transition:.2s}
.aisw .knob::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;
  background:#fffaeb;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:.2s}
.aisw b{font-size:13px;font-weight:bold;color:var(--ink2)}
.aisw em{font-style:normal;font-size:10.5px;color:var(--faint)}
.aisw.on{border-color:var(--cin);background:rgba(253,240,232,.95)}
.aisw.on .knob{background:var(--cin)}
.aisw.on .knob::after{left:15px}
.aisw.on b{color:var(--cin)}
.aisw.on em{color:var(--cin);opacity:.8}
.act{flex-wrap:wrap;padding-top:2px}

/* ---- 法宝：横条药丸，独占一行 ---- */
.relics{display:flex;gap:6px;align-items:center;justify-content:center;padding:2px 10px 4px;
  position:relative;z-index:7;flex-wrap:wrap}
.relics .rlab{font-size:10px;color:var(--faint);letter-spacing:2px}
.relic{display:inline-flex;align-items:center;gap:5px;width:auto;height:auto;padding:4px 10px 4px 7px;
  border:2px solid var(--ink);border-radius:16px;background:linear-gradient(180deg,#f2e2c0,#dcc79c);
  box-shadow:1px 2px 0 rgba(27,25,22,.28)}
.relic b{font-size:15px;color:#2c1d0c;font-weight:500}
.relic span{font-size:10.5px;color:#4a331b}
.relic .rt{display:none}

/* 评审版跳关入口 */
.jump{position:absolute;right:6px;top:6px;font-size:10.5px;color:#fff;background:rgba(27,25,22,.72);
  border:1px solid rgba(255,250,235,.5);border-radius:11px;padding:3px 9px;letter-spacing:1px;z-index:4}
.jump:active{background:var(--cin)}

#app{padding:27px 0}
.curtain{bottom:27px}
.veil,.result{top:27px;bottom:27px}
.screen{top:27px;bottom:27px}
.dark{z-index:2}
</style>
</head>
<body>
<div id="app">
  <div class="scene" id="scene"></div>
  <div class="dark" id="dark"></div>

  <div class="top"><span>第 <b id="lv">1</b>/4 关</span>
    <span class="combo" id="combo">　</span>
    <span class="again" id="again">🔊 再念一遍</span></div>

  <div class="field">
    <div class="mname" id="mname"></div>
    <div class="hpwrap" id="hpwrap"><div class="hpghost" id="hpghost"></div><div class="hpbar" id="hpbar"></div><div id="hpticks"></div></div>
    <div class="monwrap" id="monwrap"><div class="mon" id="mon"></div><div class="dmg" id="dmg"></div><div class="shock" id="shock"></div></div>
  </div>

  <div class="clash">
    <div class="bwrap"><div class="bub up" id="rowUp"></div></div>
    <div class="goal" id="goal"></div>
    <div class="judge" id="judge"></div>
    <div class="bwrap"><div class="bub dn empty" id="rowDn"></div></div>
  </div>

  <div class="pbar">
    <div class="lampbox" id="lampbox">
      <svg class="lamp" viewBox="0 0 52 74">
        <path d="M14 34 L38 34 L34 62 L18 62 Z" fill="#e0d2b4" stroke="#1b1916" stroke-width="2.4" stroke-linejoin="round"/>
        <clipPath id="bowl"><path d="M14 34 L38 34 L34 62 L18 62 Z"/></clipPath>
        <rect class="oilfill" id="oilfill" x="12" y="38" width="28" height="24" fill="#b8892b" opacity=".85" clip-path="url(#bowl)"/>
        <path d="M18 62 L34 62 L36 68 L16 68 Z" fill="#c9bb9c" stroke="#1b1916" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M26 34 L26 26" stroke="#1b1916" stroke-width="2.2"/>
        <g class="flame" style="transform-box:fill-box">
          <path d="M26 6 C34 15 33 24 26 26 C19 24 18 15 26 6Z" fill="#e0a02a"/>
          <path d="M26 13 C30 18 29.5 23 26 24.6 C22.5 23 22 18 26 13Z" fill="#f6e3a8"/></g>
      </svg>
      <div class="pips" id="pips"></div><div class="olab" id="olab">灯油</div>
    </div>
    <div class="elder"><div class="face" id="face">🧙</div><div class="say" id="say"></div></div>
  </div>

  <div class="relics" id="relics"></div>
  <div id="zone"></div>
  <div class="act" id="act"></div>
  <div class="curtain" id="curtain"></div>
  <div class="veil" id="veil"><div class="panel" id="panel"></div></div>
  <div class="result" id="result"></div>

  <div class="roller t"></div><div class="silk t"></div>
  <div class="silk b"></div><div class="roller b"></div>

  <div class="screen" id="scr-intro"><div class="fade"></div><div class="skip">跳 过</div><div class="body"></div></div>
  <div class="screen" id="scr-pen"><div class="fade"></div><div class="body"></div></div>
  <div class="screen" id="scr-map"><div class="fade"></div><div class="body"></div></div>
  <div class="screen" id="scr-fin"><div class="fade"></div><div class="body"></div></div>

function gen1(cat){
  const out=[],pool=byCat(cat,"n");
  for(const a of pool)for(const b of pool){
    if(a.s===b.s) continue;
    if(isP(a.t)===isP(b.t)) continue;
    out.push([word([a],"n"),word([b],"n")]);
  }
  return out;
}
function gen2(cat){
  const out=[],nouns=byCat(cat,"n");
  for(const modCat of ["颜色","数字","时候"]){
    const mods=byCat(modCat);
    for(const m1 of mods)for(const m2 of mods){
      if(m1.s===m2.s||isP(m1.t)===isP(m2.t)) continue;
      for(const n1 of nouns)for(const n2 of nouns){
        if(n1.s===n2.s||isP(n1.t)===isP(n2.t)) continue;
        if(!canFit(m1,n1)||!canFit(m2,n2)) continue;
        const A=[m1,n1],B=[m2,n2],pt=modCat+"-n";
        if(!oppKey(A,B)||!noDup(A,B)) continue;
        out.push([word(A,pt),word(B,pt)]);
      }
    }
  }
  // 场所 + 名   山鸟对水鱼 / 林莺对海鹤
  const heads=CH.filter(x=>HEAD.includes(x.s));
  for(const h1 of heads)for(const h2 of heads){
    if(h1.s===h2.s||isP(h1.t)===isP(h2.t)) continue;
    for(const n1 of nouns)for(const n2 of nouns){
      if(n1.s===n2.s||isP(n1.t)===isP(n2.t)) continue;
      if(HEAD.includes(n1.s)||HEAD.includes(n2.s)) continue;   // 场所不作尾字
      if(!(HEADFIT[h1.s]||[]).includes(n1.c)||!(HEADFIT[h2.s]||[]).includes(n2.c)) continue;
      if(!THING.includes(n1.s)||!THING.includes(n2.s)) continue;   // 尾字必须是「能出现在那儿的东西」
      const A=[h1,n1],B=[h2,n2];
      if(!oppKey(A,B)||!noDup(A,B)) continue;
      out.push([word(A,"place-n"),word(B,"place-n")]);
    }
  }
  return out;
}
function gen3(cat){
  const out=[],nums=byCat("数字"),locs=CH.filter(x=>LOCS.includes(x.s));
  const places=CH.filter(x=>PLACE.includes(x.s));
  const things=CH.filter(x=>THING.includes(x.s)&&x.c===cat);
  if(!things.length) return out;
  // 数 + 场所 + 物   一江水 / 万岭泉
  for(const q1 of nums)for(const q2 of nums){
    if(q1.s===q2.s) continue;
    for(const p1 of places)for(const p2 of places){
      if(p1.s===p2.s||isP(p1.t)===isP(p2.t)) continue;
      if(!canFit(q1,p1)||!canFit(q2,p2)) continue;
      for(const n1 of things)for(const n2 of things){
        if(n1.s===n2.s||isP(n1.t)===isP(n2.t)) continue;
        const A=[q1,p1,n1],B=[q2,p2,n2];
        if(!oppKey(A,B)||!noDup(A,B)) continue;
        out.push([word(A,"num-place-thing"),word(B,"num-place-thing")]);
      }
    }
  }
  // 场所 + 方位 + 物   山中月 / 水上云
  for(const p1 of places)for(const p2 of places){
    if(p1.s===p2.s||isP(p1.t)===isP(p2.t)) continue;
    for(const l1 of locs)for(const l2 of locs){
      if(l1.s===l2.s||isP(l1.t)===isP(l2.t)) continue;
      if(!LOCPAIR.includes(p1.s+l1.s)||!LOCPAIR.includes(p2.s+l2.s)) continue;
      for(const n1 of things)for(const n2 of things){
        if(n1.s===n2.s||isP(n1.t)===isP(n2.t)) continue;
        const A=[p1,l1,n1],B=[p2,l2,n2];
        if(!oppKey(A,B)||!noDup(A,B)) continue;
        out.push([word(A,"place-loc-thing"),word(B,"place-loc-thing")]);
      }
    }
  }
  return out;
}

const TM=["","ˉ","ˊ","ˇ","ˋ"];
const isP=t=>t<=2;
function keyPos(n){const s=new Set();for(let i=1;i<n;i+=2)s.add(i);s.add(n-1);return[...s].sort((a,b)=>a-b)}
function judge(up,dn,rules){
  const n=up.t.length;
  if(dn.t.length!==n)return 0;
  if(isP(up.t[n-1])===isP(dn.t[n-1]))return 0;
  if(rules.includes("位")&&!keyPos(n).every(i=>isP(up.t[i])!==isP(dn.t[i])))return 2;
  if(rules.includes("类")&&up.c!==dn.c)return 2;
  return 3;
}
const SZ=n=>n===1?{g:58,w:76,box:66,b:40}:n===2?{g:46,w:62,box:54,b:32}:n===3?{g:38,w:52,box:46,b:26}:{g:27,w:41,box:35,b:20};

let AC=null;const ac=()=>AC=AC||new(window.AudioContext||window.webkitAudioContext)();
function toneOf(t,when){try{const C=ac(),o=C.createOscillator(),g=C.createGain();o.type="sine";o.connect(g);g.connect(C.destination);
  const s=C.currentTime+when,F=o.frequency,d=isP(t)?.40:.19;
  if(t===1)F.setValueAtTime(330,s);
  else if(t===2){F.setValueAtTime(250,s);F.linearRampToValueAtTime(410,s+d)}
  else if(t===3){F.setValueAtTime(300,s);F.linearRampToValueAtTime(200,s+d*.45);F.linearRampToValueAtTime(340,s+d)}
  else{F.setValueAtTime(430,s);F.linearRampToValueAtTime(185,s+d)}
  g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.15,s+.015);
  g.gain.exponentialRampToValueAtTime(.001,s+d);o.start(s);o.stop(s+d+.02);return d}catch(e){return .3}}
function playWord(w,off){let t=off||0;w.t.forEach(x=>{const d=toneOf(x,t);t+=d+.07});return t}
function speak(txt){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(txt);u.lang="zh-CN";u.rate=.72;speechSynthesis.speak(u)}catch(e){}}
const beep=(f,d,v,ty)=>{try{const C=ac(),o=C.createOscillator(),g=C.createGain();o.type=ty||"triangle";o.frequency.value=f;
 o.connect(g);g.connect(C.destination);g.gain.setValueAtTime(v||.1,C.currentTime);
 g.gain.exponentialRampToValueAtTime(.001,C.currentTime+d);o.start();o.stop(C.currentTime+d)}catch(e){}};
const sBig=()=>[523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>beep(f,.5,.11,"sine"),i*60));
const sHit=()=>{beep(170,.18,.15,"square");setTimeout(()=>beep(110,.24,.11,"square"),60)};
const sBad=()=>beep(140,.32,.1,"sawtooth");const sTap=()=>beep(600,.05,.08);
const sRoar=()=>{beep(85,.55,.13,"sawtooth");setTimeout(()=>beep(66,.55,.11,"sawtooth"),160)};


let st={};const $=id=>document.getElementById(id);
const sh=a=>a.map(x=>[Math.random(),x]).sort((m,n)=>m[0]-n[0]).map(x=>x[1]);

function start(){st={lv:0,book:[],jues:[],caught:[],hits:0,deaths:0,combo:0};$("result").className="result";enterLevel()}
function enterLevel(){
  const L=LEVELS[st.lv];
  st.hp=L.hp;st.oil=L.oil;st.help=2;st.bookMark=st.book.length;st.phase=0;st.lock=false;st.used=new Set();
  drawMon();
  if(!st.jues.includes(L.jue.tt))return showJue(L.jue,()=>{st.jues.push(L.jue.tt);newRound()});
  newRound();
}
function showJue(j,after){
  $("panel").innerHTML=`<div class="jhead"><div class="lv">${j.lv}</div></div>
    <div class="jtt">${j.tt}</div><div class="jsub">${j.sub}</div>
    <div class="jdemo">${j.demo}</div><div class="jds">${j.ds}</div><button id="jok">记 住 了</button>`;
  $("veil").className="veil show";sBig();
  $("jok").onclick=()=>{$("veil").className="veil";after()};
}
function drawMon(){
  const L=LEVELS[st.lv];
  $("mon").innerHTML=SVGS[L.art](L.color)+CRACKS;$("mon").className="mon";
  $("mname").innerHTML=L.name+"　"+(L.cat!=="混"?"只认<span>"+CATN[L.cat]+"</span>":"<span>墨雾遮眼</span>");
  $("lv").textContent=st.lv+1;
  $("hpticks").innerHTML=Array.from({length:L.hp-1},(_,i)=>`<div class="hptick" style="left:${(i+1)/L.hp*100}%"></div>`).join("");
  $("hpghost").style.width="100%";$("hpbar").style.width="100%";hpUI();
}
function hpUI(){
  const L=LEVELS[st.lv],r=Math.max(0,st.hp/L.hp);
  $("hpbar").style.width=r*100+"%";setTimeout(()=>$("hpghost").style.width=r*100+"%",30);
  $("hpwrap").className="hpwrap"+(r<=.34?" low":"");
  ["ck1","ck2","ck3"].forEach((id,i)=>{const e=$(id);if(e)e.setAttribute("class","crk"+(r<=[.75,.5,.25][i]?" on":""))});
  const or=st.oil/L.oil;
  $("oilfill").setAttribute("height",(24*or).toFixed(1));
  $("oilfill").setAttribute("y",(62-24*or).toFixed(1));
  $("pips").innerHTML=Array.from({length:L.oil},(_,i)=>`<div class="pip ${i<st.oil?"":"off"}"></div>`).join("");
  $("olab").textContent="还能出 "+st.oil+" 次";
  $("lampbox").classList.toggle("dying",st.oil<=1);
  $("dark").style.opacity=(1-or)*.5;
  $("combo").textContent=st.combo>0?("连击 ×"+Math.min(2**st.combo,4)):"　";
}

function newRound(){
  const L=LEVELS[st.lv];st.sel=null;st.first=null;st.tries=0;st.lock=false;st.fog=!!L.boss;
  if(L.mode==="build"){
    const B=BUILD[Math.min(st.phase,BUILD.length-1)];st.B=B;st.up=B.up;
    st.slots=B.pre.map(s=>s?{s:s,t:TONEOF[s],locked:true}:null);st.trayUsed={};
  }else{
    const pl=PAIRS.filter(p=>p[0].t.length===L.len&&p[0].c===L.cat);
    let cd=pl.filter(p=>!st.used.has(p[0].s));if(!cd.length){st.used=new Set();cd=pl}
    let pr=cd[Math.floor(Math.random()*cd.length)];
    if(Math.random()<.5)pr=[pr[1],pr[0]];
    st.used.add(pr[0].s);st.up=pr[0];st.right=pr[1];
    const others=[];
    PAIRS.forEach(p=>p.forEach(c=>{if(c.t.length===L.len&&c.s!==pr[1].s&&c.s!==pr[0].s)others.push(c)}));
    st.hand=sh([pr[1],...sh(others).slice(0,4)]).map(c=>({...c,cut:false}));
  }
  render(true);
  $("mon").classList.add("spit");setTimeout(()=>$("mon").classList.remove("spit"),560);
  sRoar();
  setTimeout(()=>{playWord(st.up);setTimeout(()=>speak(st.up.s),st.up.t.length*500+150)},480);
}

function cellHTML(g,t,i,n,opt){
  const z=SZ(n),o=opt||{};
  return `<div class="cell ${o.op?"op":""}" style="animation-delay:${(i||0)*.1+.12}s">
    ${o.label!==undefined?`<div class="slab">${o.label}</div>`:""}
    <div class="gbox ${o.cls||""}" style="width:${z.box}px;height:${z.box}px;font-size:${z.g}px">${g}</div>
    ${t?`<div class="br" style="width:${isP(t)?z.b:z.b*.3}px;background:${isP(t)?"var(--chang)":"var(--duan)"}"></div>`:`<div class="br"></div>`}</div>`;
}
const catTag=c=>`<div class="cat" style="background:${CAT[c]}">${CATN[c]}</div>`;

function drawGoal(){
  const L=LEVELS[st.lv],up=st.up,n=up.t.length,last=isP(up.t[n-1]);
  const bar=p=>`<i class="rbar ${p?"c":"d"}"></i>`;
  if(L.mode==="build"){
    $("goal").innerHTML=`<div class="ribbon"><span class="rk">要 接</span>
      <span class="rv">打 ✓ 的格子${bar(1)}对${bar(0)}</span></div>`;return;
  }
  let h=`<div class="ribbon"><span class="rk">要 接</span>
    <span class="rv">${bar(!last)}${last?"短":"长"}音</span>`;
  if(L.rules.includes("类"))h+=`<span class="rc" style="background:${CAT[up.c]}">${CATN[up.c]}</span>`;
  if(L.rules.includes("位")&&n>2)h+=`<span class="rx">每个 ✓ 位都要反</span>`;
  $("goal").innerHTML=h+`</div>`;
}
function elderSay(l1,l2){$("say").innerHTML=`<div class="l1">${l1}</div>`+(l2?`<div class="l2">${l2}</div>`:"")}

function render(fresh){
  const L=LEVELS[st.lv],up=st.up,n=up.t.length;
  hpUI();drawGoal();$("face").textContent="🧙";
  elderSay(L.mode==="build"?"每一格只挑那一类的字。":"念一念，挑一张打出去。",
           L.mode==="build"?"红框的格子归你填，灰的已经填好了。":"先想好再出手 —— 一次就中，伤害翻倍。");
  if(fresh)$("rowUp").innerHTML=`<div class="who">妖 说</div>`+[...up.s].map((g,i)=>cellHTML(g,up.t[i],i,n)).join("")+catTag(up.c);
  drawJudge(null);
  if(L.mode==="build")drawSlots();
  else{$("rowDn").className="bub dn empty";
    $("rowDn").innerHTML=`<div class="who">你 说</div>`+[...up.s].map((_,i)=>cellHTML("〇",0,i,n)).join("")}
  L.mode==="build"?renderTrays():renderHand();
}
function drawJudge(dn){
  const up=st.up,n=up.t.length,kp=keyPos(n),z=SZ(n);
  const marks=[...up.s].map((_,i)=>{
    if(!kp.includes(i))return`<div class="mk na" style="width:${z.w}px">·</div>`;
    if(!dn||dn.t[i]===undefined)return`<div class="mk na" style="width:${z.w}px">✓?</div>`;
    if(st.fog)return`<div class="mk fog" style="width:${z.w}px">?</div>`;
    const ok=isP(up.t[i])!==isP(dn.t[i]);
    return`<div class="mk ${ok?"ok":"no"}" style="width:${z.w}px">${ok?"✓":"✗"}</div>`}).join("");
  $("judge").innerHTML=marks+`<div class="seal" id="seal"></div>`;
}

function renderHand(){
  $("zone").innerHTML='<div class="hand" id="hand"></div>';
  $("hand").innerHTML=st.hand.map((c,i)=>
    `<div class="card ${st.sel===i?"sel":""} ${c.cut?"cut":""} ${c.t.length>=3?"l3":""}" data-i="${i}" style="animation-delay:${i*.3}s">
      <div class="t">${c.s}</div>
      <div class="bars">${c.t.map(t=>`<div class="bb" style="width:${isP(t)?17:7}px;background:${isP(t)?"var(--chang)":"var(--duan)"}"></div>`).join("")}</div>
      <div class="cn" style="background:${CAT[c.c]}">${CATN[c.c]}</div></div>`).join("");
  [...$("hand").children].forEach(el=>el.onclick=()=>selectCard(+el.dataset.i));
  actBar(st.sel===null,"打 出 去");
}
function actBar(dis,label){
  const L=LEVELS[st.lv];
  $("act").innerHTML=`<button id="go" ${dis?"disabled":""}>${label}</button>`+
    (st.help>0?`<button class="aux" id="hp2">${L.boss?"散墨雾":"划掉两张"} ${st.help}</button>`:"");
  if($("go"))$("go").onclick=doGo;
  if($("hp2"))$("hp2").onclick=elderHelp;
}
function doGo(){
  const L=LEVELS[st.lv];
  if(L.mode==="build"){if(st.slots.every(Boolean))commit(mkLine())}
  else if(st.sel!==null)commit(st.hand[st.sel]);
}
function selectCard(i){
  if(st.lock)return; if(st.hand[i].snared||st.hand[i].cut)return;
  if(st.first===null)st.first=i;else if(i!==st.sel)st.tries++;
  st.sel=i;sTap();showFacts(st.hand[i]);renderHand();playWord(st.hand[i],.05);
}
function elderHelp(){
  if(st.help<=0||st.lock)return;
  const L=LEVELS[st.lv];
  if(L.boss){
    st.help--;st.fog=false;elderSay("墨雾散了。","这一句的 ✓✗ 我替你标出来了。");
    if(st.slots&&st.slots.every(Boolean))showFacts(mkLine());else drawSlots();
    renderTrays();sBig();return;
  }
  let cut=0,why="";
  // 先划接不住的，不够两张再划宽对的
  st.hand.forEach(c=>{if(cut<2&&!c.cut&&judge(st.up,c,L.rules)===0){c.cut=true;cut++;
    why=`它们的末字跟妖撞了，长短一样。`}});
  if(cut<2)st.hand.forEach(c=>{if(cut<2&&!c.cut&&judge(st.up,c,L.rules)===2){c.cut=true;cut++;
    why=why?why+"另一张伤不重，也划了。":"这几张伤不重，划掉省灯油。"}});
  if(cut===0){elderSay("这手牌里没有该划的。","剩下的都能伤着它，挑一张吧。");return}
  st.help--;
  if(st.sel!==null&&st.hand[st.sel].cut)st.sel=null;
  elderSay(`划掉了 ${cut} 张。`,why);renderHand();sBig();
}

function showFacts(dn){
  const L=LEVELS[st.lv],up=st.up,n=up.t.length,kp=keyPos(n);
  $("rowDn").className="bub dn";
  if(L.mode!=="build")$("rowDn").innerHTML=`<div class="who">你 说</div>`+
    [...dn.s].map((g,i)=>cellHTML(g,dn.t[i],0,n)).join("")+catTag(dn.c);
  drawJudge(dn);
  if(st.fog){$("face").textContent="🌫️";elderSay("墨雾遮着，我看不出对不对。","自己念一遍：长的要配短的。");return}
  const bad=kp.filter(i=>isP(up.t[i])===isP(dn.t[i]));
  let l1,l2="";
  if(bad.length===0)l1=`长短处处相反。`;
  else if(bad.length===1&&bad[0]===n-1)l1=`末字撞了 ——「${up.s[n-1]}」和「${dn.s[n-1]}」都是${isP(up.t[n-1])?"<i>长</i>":"<u>短</u>"}音。`;
  else l1=`第 ${bad.map(i=>i+1).join("、")} 个字撞了，长短一样。`;
  l2=L.rules.includes("类")?`门类：${CATN[up.c]}　对　${CATN[dn.c]}${up.c===dn.c?"（一家）":"（不是一家）"}`
                          :`妖吐的是${isP(up.t[n-1])?"长":"短"}音。`;
  $("face").textContent="🧙";elderSay(l1,l2);
}

/* ---- 拼字 ---- */
function drawSlots(){
  const B=st.B;
  $("rowDn").className="bub dn";
  $("rowDn").innerHTML=`<div class="who">你 说</div>`+st.slots.map((c,i)=>{
    const op=B.open.includes(i);
    return cellHTML(c?c.s:"　",c?c.t:0,i,5,{label:TRAY[i].n,op:op,
      cls:"slot "+(c?(c.locked?"lock":""):(op?"open":""))}).replace('<div class="cell ','<div data-s="'+i+'" class="cell ')}).join("")+catTag("颜色");
  [...$("rowDn").querySelectorAll("[data-s]")].forEach(el=>el.onclick=()=>{
    if(st.lock)return;const i=+el.dataset.s,c=st.slots[i];if(!c||c.locked)return;
    st.trayUsed[i]=null;st.slots[i]=null;beep(280,.1,.07);afterEdit()});
  drawJudge(st.slots.every(Boolean)?mkLine():{t:st.slots.map(c=>c?c.t:undefined)});
}
function renderTrays(){
  const B=st.B;
  $("zone").innerHTML=`<div class="trays">${B.open.map(i=>{
    const empty=!st.slots[i];
    return `<div class="tray ${empty?"active":""}"><div class="tl">${TRAY[i].n}</div><div class="row">${
      TRAY[i].cs.map(([c,t])=>`<div class="gz ${st.trayUsed[i]===c?"used":""}" data-i="${i}" data-c="${c}" data-t="${t}">
        <div class="g">${c}</div><div class="bb" style="width:${isP(t)?16:7}px;background:${isP(t)?"var(--chang)":"var(--duan)"}"></div></div>`).join("")
    }</div></div>`}).join("")}</div>`;
  $("zone").querySelectorAll(".gz").forEach(el=>el.onclick=()=>{
    if(st.lock)return;const i=+el.dataset.i,c=el.dataset.c,t=+el.dataset.t;
    st.slots[i]={s:c,t:t};st.trayUsed[i]=c;sTap();toneOf(t,0);afterEdit()});
  actBar(!st.slots.every(Boolean),"成 句");
}
const mkLine=()=>({s:st.slots.map(c=>c.s).join(""),t:st.slots.map(c=>c.t),c:"颜色"});
function afterEdit(){
  drawSlots();renderTrays();
  if(st.slots.every(Boolean)){if(st.first===null)st.first=1;else st.tries++;showFacts(mkLine())}
  else{$("face").textContent="🧙";elderSay("每一格只挑那一类的字。","红框的格子归你填。")}
}

function splash(host,n,big){
  for(let i=0;i<n;i++){const d=document.createElement("div");d.className="drop";
    const a=Math.random()*Math.PI*2,r=(big?58:32)+Math.random()*(big?68:38),sz=3+Math.random()*(big?9:5);
    d.style.width=d.style.height=sz+"px";d.style.left="50%";d.style.top="50%";
    d.style.setProperty("--dx",(Math.cos(a)*r).toFixed(0)+"px");
    d.style.setProperty("--dy",(Math.sin(a)*r).toFixed(0)+"px");
    host.appendChild(d);requestAnimationFrame(()=>d.classList.add("go"));setTimeout(()=>d.remove(),700)}
}

/* ---- 出手 / 结算 ---- */
function commit(dn){
  if(st.lock)return;st.lock=true;
  const L=LEVELS[st.lv],v=judge(st.up,dn,L.rules),clean=(st.tries===0),n=st.up.t.length;
  if(L.mode!=="build"){const el=$("hand").children[st.sel];
    [...$("hand").children].forEach(c=>{if(c!==el)c.classList.add("dim")});if(el)el.classList.add("gone")}
  $("act").innerHTML="";st.fog=false;drawJudge(dn);

  let dmg=0,crit=false;
  if(L.boss){dmg=v===3?4:v===2?1:0;crit=v===3}
  else{if(v===3&&clean){dmg=3;crit=true;st.combo++;st.hits++}
       else if(v===3){dmg=2;st.combo=0}else if(v===2){dmg=1;st.combo=0}else{dmg=0;st.combo=0}}
  if(crit&&st.pen&&st.pen.eff.dmg)dmg+=st.pen.eff.dmg;
  if(st.allIn){ if(v===3)dmg*=2; st.oil--; }
  if(st.freeOil){st.freeOil=false}else{st.oil--}
  st.hp=Math.max(0,st.hp-dmg);
  if(v===3&&st.snare>=0){st.snare=-1}          // 打出三星，解开缠绕
  st.allIn=false;st.ignoreCat=false;
  st.book.push({up:st.up.s,dn:dn.s,v:v,build:L.mode==="build"});
  if(v===3&&L.mode==="build")st.phase++;

  $("rowDn").classList.add("lunge");
  setTimeout(()=>{$("rowUp").classList.add("recoil");splash(document.querySelector(".clash"),dmg>0?12:5,dmg>=3)},170);
  setTimeout(()=>{$("rowDn").classList.remove("lunge");$("rowUp").classList.remove("recoil")},700);

  setTimeout(()=>{
    const s=$("seal");if(s){s.className="seal on"+(v===0?" grey":"");
      s.innerHTML=v===3?"<b>★★★</b>工对":v===2?"<b>★★</b>宽对":"<b>—</b>不中"}
    if(dmg>0){
      $("mon").classList.add("hit");sHit();
      $("shock").className="shock go";setTimeout(()=>$("shock").className="shock",520);
      splash($("monwrap"),crit?18:10,crit);
      if(crit)$("app").classList.add("quake");
      setTimeout(()=>{$("mon").classList.remove("hit");$("app").classList.remove("quake")},460);
      const d=$("dmg");d.textContent="-"+dmg+(crit?"!":"");d.style.fontSize=crit?"38px":"28px";d.className="dmg show";
      if(crit)setTimeout(sBig,170);
    }else sBad();
    hpUI();
    setTimeout(()=>{playWord(st.up);setTimeout(()=>speak(st.up.s+"，"+dn.s),n*500+120)},260);
    setTimeout(()=>curtain(dn,v,dmg,crit,clean),700);
  },420);
}

/* 逐条讲清楚为什么 */
function whyBlock(dn,v){
  const L=LEVELS[st.lv],up=st.up,n=up.t.length,kp=keyPos(n);
  let rows=kp.map(i=>{
    const a=isP(up.t[i]),b=isP(dn.t[i]),ok=a!==b;
    return `<div class="wl"><span>第${i+1}字</span>
      <span class="t">${up.s[i]}<span style="font-size:11px;color:${a?"var(--chang)":"var(--duan)"}">(${a?"长":"短"})</span>
      <span style="color:var(--faint);margin:0 3px">对</span>
      ${dn.s[i]}<span style="font-size:11px;color:${b?"var(--chang)":"var(--duan)"}">(${b?"长":"短"})</span></span>
      <span class="v ${ok?"ok":"no"}">${ok?"✓ 相反":"✗ 撞了"}</span></div>`}).join("");
  if(L.rules.includes("类")){
    const ok=up.c===dn.c;
    rows+=`<div class="wl"><span>门类</span><span class="t">${CATN[up.c]}<span style="color:var(--faint);margin:0 3px">对</span>${CATN[dn.c]}</span>
      <span class="v ${ok?"ok":"no"}">${ok?"✓ 一家":"✗ 不是"}</span></div>`;
  }
  const sum=v===3?`打 ✓ 的位置全都相反${L.rules.includes("类")?"，门类又是一家":""} —— 所以是 <b>工对</b>`
        :v===2?`有一条没合上 —— 只算 <b>宽对</b>`:`末字都撞了 —— <b>不中</b>`;
  return `<div class="why">${rows}<div class="wsum">${sum}</div></div>`;
}

function curtain(dn,v,dmg,crit,clean){
  const L=LEVELS[st.lv],up=st.up,n=up.t.length,kp=keyPos(n);
  const bad=kp.filter(i=>isP(up.t[i])===isP(dn.t[i]));
  let title,fix="";
  if(v===3){
    title=crit?"正中要害！":"打中了";
    const k=famousOf(up.s,dn.s);
    if(k)fix=`<b>${k}</b>`;
    else if(L.mode==="build")fix=`<b>这一句是你自己作的。</b>${up.s}，${dn.s}。`;
    else if(!clean)fix=`<b>下次试试一次就中</b> —— 只点一张就打出去，伤害翻倍。`;
  }else if(v===2){
    title="只擦破了皮";
    fix=bad.length?`<b>下次这样改：</b>第 ${bad[0]+1} 个字要挑${isP(up.t[bad[0]])?"<u>短</u>":"<i>长</i>"}音的。`
      :`<b>下次这样改：</b>长短对上的牌里，再挑一张<em style="color:var(--cin)">${CATN[up.c]}</em>的。`;
  }else{
    title="没伤着它";
    fix=`<b>再试一次：</b>妖吐${isP(up.t[n-1])?"<i>长</i>":"<u>短</u>"}音，你要找${isP(up.t[n-1])?"<u>短</u>":"<i>长</i>"}音收尾的。`;
  }
  const retry=(v===0&&st.oil>0);
  $("curtain").innerHTML=`
    <div class="row1">
      <div class="cstamp ${v===0?"grey":""}"><div class="s">${v===3?"★★★":v===2?"★★":"—"}</div>
        <div class="n">${v===3?"工对":v===2?"宽对":"不中"}</div></div>
      <div class="ctxt"><div class="ct">${title}<span class="chp">${dmg>0?"妖气 -"+dmg:"灯油 -1"}</span></div></div>
    </div>
    ${whyBlock(dn,v)}
    ${fix?`<div class="cfix">${fix}</div>`:""}
    ${v===3?"":`<div class="cbtn">${retry?`<button id="rt2">再 答 一 次</button>`:`<button id="ok">知 道 了</button>`}</div>`}`;
  $("curtain").classList.add("up");
  if(v===3)setTimeout(()=>closeCurtain(false),2400);
  else if(retry)$("rt2").onclick=()=>closeCurtain(true);
  else $("ok").onclick=()=>closeCurtain(false);
}

function closeCurtain(retry){
  $("curtain").classList.remove("up");$("dmg").className="dmg";
  setTimeout(()=>{
    if(st.hp<=0)return winLevel();
    if(st.oil<=0)return sessionEnd();
    if(retry)return retryRound();
    st.lock=false;newRound();
  },330);
}
/* 同一句再答一次：上句不变，用过的牌划掉，拼字关保留已摆的字 */
function retryRound(){
  const L=LEVELS[st.lv];st.tries++;st.lock=false;
  if(L.mode==="build"){
    elderSay("这一句还能改。","把撞了的那格换一个字，再成句。");
    drawSlots();renderTrays();
  }else{
    if(st.sel!==null)st.hand[st.sel].cut=true;
    st.sel=null;
    $("rowDn").className="bub dn empty";
    $("rowDn").innerHTML=`<div class="who">你 说</div>`+[...st.up.s].map((_,i)=>cellHTML("〇",0,i,st.up.t.length)).join("");
    drawJudge(null);
    elderSay("再挑一张。","刚才那张已经划掉了。");
    renderHand();
  }
  hpUI();
}

function winLevel(){
  const L=LEVELS[st.lv];
  $("mon").classList.add("dead");splash($("monwrap"),26,true);sRoar();st.caught.push(L.word);
  setTimeout(()=>{
    $("panel").innerHTML=`<div class="jhead"><div class="lv">降 妖 得 手</div></div>
      <div class="pwrap"><div class="jtt" style="font-size:24px;margin-top:0">${L.name}散成了墨</div>
      <div class="caught">${L.word}</div>
      <div class="jds">墨迹重新聚成一个「${L.word}」字，<br>收进你的字册了。</div>
      <button id="nx">${st.lv>=LEVELS.length-1?"看 结 果":"下 一 关"}</button></div>`;
    $("veil").className="veil show";sBig();
    $("nx").onclick=()=>{$("veil").className="veil";
      if(st.lv>=LEVELS.length-1)return finish();
      st.lv++;st.combo=0;enterLevel()};
  },1000);
}
function failLevel(){
  const L=LEVELS[st.lv];st.deaths++;
  $("panel").innerHTML=`<div class="jhead"><div class="lv">灯 灭 了</div></div>
    <div class="pwrap"><div class="jtt" style="font-size:24px;margin-top:0">${L.name}还站着</div>
    <div class="jds">${L.boss?"墨雾里瞎摸打不赢。<br>先自己念一遍长短，再动手。":"每出一次牌就少一格灯油。<br><em>先想好再出手</em> —— 一次就中，伤害翻倍。"}</div>
    <button id="rt">再 来 一 次</button></div>`;
  $("veil").className="veil show";sRoar();
  $("rt").onclick=()=>{$("veil").className="veil";st.combo=0;enterLevel()};
}
function finish(){
  const g3=st.book.filter(b=>b.v===3).length;
  const rank=st.deaths===0?"降妖状元":st.deaths<=2?"降妖进士":st.deaths<=4?"降妖举人":"降妖学徒";
  $("result").innerHTML=`<div style="font-size:12px;color:var(--ink2);letter-spacing:5px;margin-top:4px">四 妖 尽 降</div>
    <div class="rank">${rank}</div>
    <div class="num">好对子 ${g3}/${st.book.length}　·　重击 ${st.hits} 次<br>灯灭 ${st.deaths} 回</div>
    <div class="book"><h4>收 到 的 字</h4>
      <div style="text-align:center;font-size:36px;letter-spacing:12px;color:var(--ink)">${st.caught.join("")}</div>
      <h4>对 出 来 的 句 子</h4>
      ${st.book.map(b=>`<div class="bi">${b.up}　${b.dn}<small>${b.v===3?(b.build?"自己作的":"★★★"):b.v===2?"★★":"—"}</small></div>`).join("")}
      <h4>学 会 的 口 诀</h4><div style="text-align:center">${st.jues.map(j=>`<span class="jt">${j}</span>`).join("")}</div>
    </div>
    <button class="btn" onclick="start()">再 战 一 轮</button>`;
  $("result").className="result show";sBig();
}

/* ================================================================
   局重构：一盏灯 = 一局 = 5 次出牌；妖血跨局保留；随时可停

const MAXHP=[12,16,20,24];          // 妖的总血，跨局累积
const SESSION_OIL=5;                // 一局的出牌次数
const SAVEKEY="duiju_save_v10";

function loadSave(){
  try{const v=localStorage.getItem(SAVEKEY);if(v)return JSON.parse(v)}catch(e){}
  return null;
}
function doSave(){
  try{localStorage.setItem(SAVEKEY,JSON.stringify({
    lv:st.lv,hp:st.prog,caught:st.caught,pen:st.pen?st.pen.k:null,
    book:st.book.slice(-40),hits:st.hits,sessions:st.sessions,jues:st.jues}))}catch(e){}
}
function clearSave(){try{localStorage.removeItem(SAVEKEY)}catch(e){}}

/* ---- 生成语料池：按关的门类和字数现取 ---- */
function buildPool(){
  const L=LEVELS[st.lv];
  if(L.mode==="build")return;
  st.pool=GEN[L.len](L.cat);
  const seen=new Set(),d=[];
  // 判门类的关才需要跨门类干扰牌；第一关只教长短，手牌就留在本门类
  const cats=L.rules.includes("类")?["天上","山水","花草","动物"]:[L.cat];
  for(const c of cats)
    for(const [a,b] of GEN[L.len](c)){
      for(const w of [a,b]) if(!seen.has(w.s)){seen.add(w.s);d.push(w)}
      if(d.length>420)break;
    }
  st.distract=d;
}

/* ---- 每局开始 ---- */
function startSession(){
  const L=LEVELS[st.lv],p=st.pen||{eff:{dmg:0,oil:0,help:0}};
  st.hp=st.prog[st.lv];st.maxhp=MAXHP[st.lv];
  st.oil=SESSION_OIL+p.eff.oil;st.help=2+p.eff.help;
  st.bookMark=st.book.length;st.sessGood=0;st.lock=false;st.used=new Set();st.phase=st.phase||0;
  drawMon();buildPool();
  if(!st.jues.includes(L.jue.tt))return showJue(L.jue,()=>{st.jues.push(L.jue.tt);doSave();newRound()});
  newRound();
}

/* ---- 出题：从生成池现取 ---- */
newRound=function(){
  const L=LEVELS[st.lv];st.sel=null;st.first=null;st.tries=0;st.lock=false;st.fog=!!L.boss;
  if(L.mode==="build"){
    const B=BUILD[Math.min(st.phase,BUILD.length-1)];st.B=B;st.up=B.up;
    st.slots=B.pre.map(x=>x?{s:x,t:TONEOF[x],locked:true}:null);st.trayUsed={};
  }else{
    const pool=st.pool;
    let pr=pool[Math.floor(Math.random()*pool.length)];
    let guard=0;
    while(st.used.has(pr[0].s+pr[1].s)&&guard++<40)pr=pool[Math.floor(Math.random()*pool.length)];
    st.used.add(pr[0].s+pr[1].s);
    if(Math.random()<.5)pr=[pr[1],pr[0]];
    st.up=pr[0];st.right=pr[1];
    const bag=st.distract.filter(w=>w.s!==pr[0].s&&w.s!==pr[1].s&&pairable(pr[0],w));
    st.hand=sh([pr[1],...sh(bag).slice(0,4)]).map(c=>({...c,cut:false}));
  }
  render(true);
  $("mon").classList.add("spit");setTimeout(()=>$("mon").classList.remove("spit"),560);
  sRoar();
  setTimeout(()=>{playWord(st.up);setTimeout(()=>speak(st.up.s),st.up.t.length*500+150)},480);
};

 云:{icon:"云",t:"这句不看门类",fn:()=>{st.ignoreCat=true;elderSay("云气罩住了妖眼。","这一句门类不算数，只看长短。")}},

/* ---- 牌库：一局一副，出一补一 ---- */
function buildDeck(){
  const L=LEVELS[st.lv];
  const all=GEN[L.len](L.cat);
  // 该关只用一种句式，手牌不混搭法
  const cnt={};all.forEach(p=>cnt[p[0].pt]=(cnt[p[0].pt]||0)+1);
  const PT=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];
  st.pt=PT;
  const seen=new Set(),own=[],other=[];
  for(const [a,b] of all) for(const w of [a,b])
    if(w.pt===PT&&!seen.has(w.s)){seen.add(w.s);own.push(w);if(own.length>200)break}
  for(const c of ["天上","山水","花草","动物"]){
    if(c===L.cat)continue;
    for(const [a,b] of GEN[L.len](c)) for(const w of [a,b])
      if(w.pt===PT&&!seen.has(w.s)){seen.add(w.s);other.push(w);if(other.length>160)break}
  }
  st.deck=sh([...sh(own).slice(0,9),...sh(other).slice(0,7)]).map(w=>({...w,cut:false,snared:false}));
  st.hand=st.deck.splice(0,5);
}
/* 上句必须是手牌接得住的：牌库变少 → 好解变少，这就是留牌的张力 */
function pickUp(){
  const L=LEVELS[st.lv],pool=st.pool;
  const live=(st.hand||[]).filter(c=>!c.cut&&!c.snared);
  const rnd=()=>pool[Math.floor(Math.random()*pool.length)];
  if(!live.length){const pr=rnd();return[pr[0],pr[1]]}
  const tryFind=want=>{
    for(let k=0;k<260;k++){
      let pr=rnd();
      if(st.pt&&pr[0].pt!==st.pt)continue;
      if(Math.random()<.5)pr=[pr[1],pr[0]];
      if(st.used.has(pr[0].s+pr[1].s))continue;
      const hit=live.find(c=>pairable(pr[0],c)&&judge(pr[0],c,L.rules)===want);
      if(hit)return[pr[0],hit];
    }
    return null;
  };
  const r=tryFind(3)||tryFind(2);
  if(r)return r;
  const pr=rnd();return[pr[0],pr[1]];
}

/* ---- 出题（牌库版） ---- */
newRound=function(){
  const L=LEVELS[st.lv];st.sel=null;st.first=null;st.tries=0;st.lock=false;st.fog=!!L.boss;
  st.allIn=false;
  if(L.mode==="build"){
    const B=BUILD[Math.min(st.phase,BUILD.length-1)];st.B=B;st.up=B.up;
    st.slots=B.pre.map(x=>x?{s:x,t:TONEOF[x],locked:true}:null);st.trayUsed={};
  }else if(has("deck")){
    // 藤妖：每三回合缠住一张
    st.round=(st.round||0)+1;
    if(st.lv===2&&st.snare<0&&st.round%3===0){
      const cand=st.hand.map((c,i)=>i).filter(i=>!st.hand[i].cut);
      if(cand.length>1){st.snare=cand[Math.floor(Math.random()*cand.length)];
        st.hand[st.snare].snared=true;}
    }
    const [up,best]=pickUp();
    st.up=up;st.right=best;st.used.add(up.s+best.s);
    // 水妖：混淆 —— 保证手里有 1-2 张"长短对、门类错"的陷阱
    if(st.lv===1){
      const traps=st.hand.filter(c=>judge(up,c,L.rules)===2).length;
      if(traps<1&&st.deck&&st.deck.length){
        const t=st.deck.findIndex(c=>judge(up,c,L.rules)===2);
        if(t>=0){const i=st.hand.findIndex(c=>c!==best&&!c.snared&&judge(up,c,L.rules)===0);
          if(i>=0){st.deck.push(st.hand[i]);st.hand[i]=st.deck.splice(t,1)[0]}}
      }
    }
  }else{
    const pool=st.pool;
    let pr=pool[Math.floor(Math.random()*pool.length)];let g=0;
    while(st.used.has(pr[0].s+pr[1].s)&&g++<40)pr=pool[Math.floor(Math.random()*pool.length)];
    st.used.add(pr[0].s+pr[1].s);
    if(Math.random()<.5)pr=[pr[1],pr[0]];
    st.up=pr[0];st.right=pr[1];
    const bag=st.distract.filter(w=>w.s!==pr[0].s&&w.s!==pr[1].s&&pairable(pr[0],w));
    st.hand=sh([pr[1],...sh(bag).slice(0,4)]).map(c=>({...c,cut:false,snared:false}));
  }
  render(true);renderRelics();
  $("mon").classList.add("spit");setTimeout(()=>$("mon").classList.remove("spit"),560);
  sRoar();
  setTimeout(()=>{playWord(st.up);setTimeout(()=>speak(st.up.s),st.up.t.length*500+150)},480);
};

/* ---- 手牌：显示缠绕与牌库余量 ---- */
const _renderHand=renderHand;
renderHand=function(){
  _renderHand();
  const h=$("hand");if(!h)return;
  st.hand.forEach((c,i)=>{const el=h.children[i];if(!el)return;
    if(c.snared){el.classList.add("snared");
      el.insertAdjacentHTML("beforeend",'<span class="snaretag">缠住了</span>')}});
  if(has("deck")&&st.deck&&st.deck.length!==undefined)
    h.insertAdjacentHTML("beforeend",`<div class="deckinfo">牌库 ${st.deck.length}</div>`);
};

/* ---- 按钮排：全力一击 ---- */
const _actBar=actBar;
actBar=function(dis,label){
  const on=!!st.allIn;
  _actBar(dis, on&&!dis ? "全 力 打 出 去" : label);
  const go=$("go");
  if(go&&on){go.style.background="#7a2b22";go.style.borderColor="#3d1410"}
  if(!has("allin")||LEVELS[st.lv].mode==="build")return;
  const row=document.createElement("div");
  row.className="airow";
  row.innerHTML=`<div class="aisw ${on?"on":""}" id="ai">
      <span class="knob"></span>
      <b>全力一击</b><em>押 1 格灯油　三星伤害 ×2</em></div>`;
  $("act").appendChild(row);
  $("ai").onclick=()=>{
    if(st.lock)return;
    if(!st.allIn&&st.oil<2){elderSay("灯油不够押了。","只剩一格的时候，稳着打。");return}
    st.allIn=!st.allIn;sTap();
    elderSay(st.allIn?"押上了。":"不押了。",
             st.allIn?"打中三星伤害翻倍；没中，这格油白烧。":"稳着来也好。");
    actBar(dis,label);
  };
};

/* ---- 出牌后：补牌、解缠、写回进度 ---- */
commit=function(dn){
  const wasAllIn=st.allIn;
  _commit2(dn);
  st.prog[st.lv]=st.hp;
  if(has("deck")&&st.deck&&LEVELS[st.lv].mode!=="build"){
    let i=st.hand.indexOf(dn);
    if(i<0&&st.sel!==null)i=st.sel;
    if(i<0)i=st.hand.findIndex(c=>c.s===dn.s);
    if(i>=0)st.hand.splice(i,1);
    if(st.deck.length)st.hand.push(st.deck.shift());
    st.snare=st.hand.findIndex(c=>c.snared);
  }
  if(wasAllIn)st.allInUsed=(st.allInUsed||0)+1;
};

/* ---- 每局开始：发牌库、清法宝、授法 ---- */
const _startSession=startSession;
startSession=function(){
  st.snare=-1;st.round=0;st.relicUsed=[];st.allIn=false;st.freeOil=false;st.ignoreCat=false;
  const L=LEVELS[st.lv];
  if(has("deck")&&L.mode!=="build"){buildDeck()}else{st.deck=null;st.hand=st.hand||[]}
  _startSession();            // 里面才 newRound()，此时牌库和手牌已就位
  renderRelics();
};
/* 授法卡：口诀之后再来一张 */
const _showJue=showJue;
showJue=function(j,after){
  _showJue(j,()=>{
    const fa=FA[st.lv],sk=YAOSKILL[st.lv];
    const chain=[];
    if(fa&&!st.jues.includes(fa.tt))chain.push(()=>{st.jues.push(fa.tt);
      _showJue(fa,()=>run())});
    if(sk)chain.push(()=>_showJue({lv:"妖 的 本 事",tt:sk.n,sub:LEVELS[st.lv].name,
      demo:`<div class="big" style="font-size:19px">${LEVELS[st.lv].name} · ${sk.n}</div>`,
      ds:sk.d},()=>run()));
    let i=0;
    function run(){ if(i<chain.length){const f=chain[i++];f()} else after() }
    run();
  });
};

/* ---- 牌库模式下要先发牌再出题 ---- */
const _buildPool=buildPool;
buildPool=function(){_buildPool();};


/* ---- 长老指点：划掉 = 弃牌，立刻补新的 ---- */
elderHelp=function(){
  if(st.help<=0||st.lock)return;
  const L=LEVELS[st.lv];
  if(L.boss){
    st.help--;st.fog=false;
    elderSay("墨雾散了。","这一句的 ✓✗ 我替你标出来了。");
    if(st.slots&&st.slots.every(Boolean))showFacts(mkLine());else drawSlots();
    renderTrays();sBig();return;
  }
  const bad=[];
  st.hand.forEach((c,i)=>{if(c.snared)return;
    const v=judge(st.up,c,L.rules);
    if(v===0)bad.push({i,v}); });
  st.hand.forEach((c,i)=>{if(c.snared)return;
    if(bad.length<2&&judge(st.up,c,L.rules)===2&&!bad.some(b=>b.i===i))bad.push({i,v:2}); });
  const drop=bad.slice(0,2);
  if(!drop.length){elderSay("这手牌里没有该划的。","剩下的都能伤着它，挑一张吧。");return}
  st.help--;
  const why=drop.some(d=>d.v===0)?"它们的末字跟妖撞了，长短一样。":"它们伤不重，划掉省灯油。";
  // 从大到小删，避免下标错位；有牌库就补，没有就从干扰池补
  drop.map(d=>d.i).sort((a,b)=>b-a).forEach(i=>{
    st.hand.splice(i,1);
    if(has("deck")&&st.deck&&st.deck.length)st.hand.push(st.deck.shift());
    else if(st.distract&&st.distract.length){
      const bag=st.distract.filter(w=>pairable(st.up,w)&&!st.hand.some(h=>h.s===w.s));
      if(bag.length)st.hand.push({...bag[Math.floor(Math.random()*bag.length)],cut:false,snared:false});
    }
  });
  st.sel=null;st.snare=st.hand.findIndex(c=>c.snared);
  elderSay(`划掉了 ${drop.length} 张，补了新的。`,why);
  $("rowDn").className="bub dn empty";
  $("rowDn").innerHTML=`<div class="who">你 说</div>`+
    [...st.up.s].map((_,i)=>cellHTML("〇",0,i,st.up.t.length)).join("");
  drawJudge(null);renderHand();sBig();
};


/* ---- 结构不同或重字，最多算宽对（对联忌重字） ---- */
const _judge0=judge;
judge=function(up,dn,rules){
  let v=_judge0(up,dn,rules);
  if(v===3&&up&&dn&&up.pt&&dn.pt&&!pairable(up,dn))v=2;
  return v;
};
function flaw(up,dn){
  if(!up||!dn||!up.pt||!dn.pt)return null;
  const dup=[...up.s].find(ch=>dn.s.includes(ch));
  if(dup)return{k:"重字",t:`两句里都有「${dup}」`,fix:`换一张不带「${dup}」的牌。`};
  if(up.pt!==dn.pt)return{k:"搭法",t:"两句的搭法不一样",fix:"挑一张跟上句摆法相同的牌。"};
  return null;
}
/* 预演里说清楚 */
const _showFacts=showFacts;
showFacts=function(dn){
  _showFacts(dn);
  if(st.fog)return;
  const f=flaw(st.up,dn);
  if(f){$("face").textContent="🤨";
    elderSay(`${f.t}。`,`长短门类就算都对上，也只能算宽对。`)}
};
/* 结算幕里补一行 */
const _whyBlock=whyBlock;
whyBlock=function(dn,v){
  let h=_whyBlock(dn,v);
  const f=flaw(st.up,dn);
  if(f)h=h.replace('<div class="wsum">',
    `<div class="wl"><span>${f.k}</span><span class="t">${f.t}</span>
      <span class="v no">✗ 犯忌</span></div><div class="wsum">`);
  return h;
};

bootGame();
</script>
