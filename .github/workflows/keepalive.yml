name: Supabase Keep-Alive

# 每天 ping 一次数据库，防止 Supabase 免费项目因闲置 7 天被自动暂停
on:
  schedule:
    - cron: "0 2 * * *"   # 每天 UTC 02:00（北京时间 10:00）
  workflow_dispatch:        # 也可以在 Actions 页面手动触发

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(grep -oE 'SUPABASE_URL\s*=\s*"[^"]+"' game-review.html | cut -d'"' -f2)
          KEY=$(grep -oE 'SUPABASE_KEY\s*=\s*"[^"]+"' game-review.html | cut -d'"' -f2)
          code=$(curl -s -m 20 -o /dev/null -w "%{http_code}" \
            "$URL/rest/v1/reviews?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase ping → HTTP $code"
          [ "$code" = "200" ] || exit 1
